            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-border-hover: rgba(255, 255, 255, 0.45);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255,255,255,0.2);
            --glass-shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255,255,255,0.3);
            --primary: #4a6fa5;
            --accent: #c7a27c;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #7a7a9a;
            --bg-gradient-start: #e8e4f3;
            --bg-gradient-mid: #d4e1f5;
            --bg-gradient-end: #f0e6f0;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --glass-bg: rgba(30, 30, 50, 0.35);
                --glass-bg-hover: rgba(40, 40, 65, 0.5);
                --glass-border: rgba(255, 255, 255, 0.12);
                --glass-border-hover: rgba(255, 255, 255, 0.25);
                --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.1);

                --text-primary: #f0f0f5;
                --text-secondary: #b0b0c5;
                --text-muted: #8080a0;
                --bg-gradient-start: #0f0f1a;
                --bg-gradient-mid: #1a1a2e;
                --bg-gradient-end: #151525;
            }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {

            background-attachment: fixed;
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .ambient-light {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .ambient-light .orb {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4;
            animation: orbFloat 20s infinite ease-in-out;
        }
        .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(74,111,165,0.3), transparent 70%); top: -10%; right: -5%; animation-delay: 0s; }
        .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(199,162,124,0.25), transparent 70%); bottom: -10%; left: -5%; animation-delay: -7s; }
        .orb-3 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(138,155,110,0.2), transparent 70%); top: 40%; left: 30%; animation-delay: -14s; }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }
        .liquid-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .liquid-glass::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 100%);
            border-radius: 24px 24px 0 0; pointer-events: none;
        }
        .liquid-glass:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-hover);
            box-shadow: var(--glass-shadow-hover);
            transform: translateY(-2px);
        }
        .top-nav {
            position: sticky; top: 12px; z-index: 1000; margin: 12px auto;
            max-width: 1160px; padding: 12px 24px;
            display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        }
        .nav-logo {
            font-size: 1.3rem; font-weight: 700; color: var(--text-primary);
            white-space: nowrap; display: flex; align-items: center; gap: 10px; text-decoration: none;
        }

            background: linear-gradient(135deg, var(--accent), var(--primary));
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(74,111,165,0.3);
        }
        .search-box { flex: 1; min-width: 220px; max-width: 480px; position: relative; }
        .search-input {
            width: 100%; padding: 12px 18px 12px 48px;
            border: 1px solid var(--glass-border); border-radius: 20px;
            font-size: 0.95rem; color: var(--text-primary); outline: none;
            background: var(--glass-bg); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); transition: var(--transition);
        }
        .search-input:focus {
            background: var(--glass-bg-hover); border-color: var(--glass-border-hover);
            box-shadow: 0 0 0 4px rgba(74,111,165,0.1);
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-icon {
            position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 0.9rem;
        }
        .nav-back {
            padding: 10px 20px; border: 1px solid var(--glass-border); border-radius: 20px;
            text-decoration: none; color: var(--text-secondary); font-size: 0.85rem;
            background: var(--glass-bg); backdrop-filter: blur(20px); transition: var(--transition); white-space: nowrap;
        }
        .nav-back:hover {
            background: var(--glass-bg-hover); border-color: var(--glass-border-hover); color: var(--primary);
        }
        .stats-bar {
            text-align: center; padding: 1.2rem 5%; color: var(--text-muted); font-size: 0.9rem;
            margin: 1rem auto 0; max-width: 1160px;
        }
        .stats-bar strong { color: var(--accent); font-size: 1.3rem; margin: 0 4px; }
        .category-bar {
            max-width: 1160px; margin: 1rem auto 0; padding: 16px 20px;
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
        }
        .cat-tab {
            padding: 10px 20px; border: 1px solid var(--glass-border); border-radius: 20px;
            background: var(--glass-bg); backdrop-filter: blur(20px);
            color: var(--text-secondary); font-size: 0.85rem; font-weight: 500;
            cursor: pointer; transition: var(--transition); user-select: none; white-space: nowrap;
        }
        .cat-tab:hover {
            background: var(--glass-bg-hover); border-color: var(--glass-border-hover); transform: translateY(-1px);
        }
        .cat-tab.active {
            background: linear-gradient(135deg, rgba(199,162,124,0.8), rgba(74,111,165,0.8));
            color: white; border-color: transparent;
            box-shadow: 0 4px 16px rgba(74,111,165,0.25);
        }
        .cat-tab .count { margin-left: 6px; opacity: 0.7; font-size: 0.75rem; font-weight: 400; }
        .main-container { max-width: 1160px; margin: 1.5rem auto; padding: 0 5% 100px; position: relative; z-index: 1; }
        .category-section { margin-bottom: 2.5rem; }
        .section-header {
            display: flex; align-items: center; gap: 12px; margin-bottom: 1.2rem; padding: 16px 24px;

        .section-icon {

        .link-card {
            display: block; text-decoration: none; color: inherit;
            padding: 20px; composes: liquid-glass;
        }
        .link-card::after {
            content: ''; position: absolute; bottom: 0; left: 20%; right: 20%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            transform: scaleX(0); transition: transform 0.4s ease;
        }
        .link-card:hover::after { transform: scaleX(1); }
        .link-card:hover { transform: translateY(-4px); }
        .card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }

            overflow: hidden; margin-bottom: 10px;
        }

        .back-to-top {

            background: var(--glass-bg); backdrop-filter: blur(20px);
            color: var(--accent); font-size: 1.1rem; cursor: pointer;
            box-shadow: var(--glass-shadow); opacity: 0; visibility: hidden;
            transform: translateY(20px); transition: var(--transition); z-index: 99;
            display: flex; align-items: center; justify-content: center;
        }
        .back-to-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
        .back-to-top:hover {
            background: var(--glass-bg-hover); border-color: var(--glass-border-hover);
            transform: translateY(-4px); box-shadow: var(--glass-shadow-hover);
        }

            text-align: center; padding: 2.5rem 5%; color: var(--text-muted);
            font-size: 0.85rem; position: relative; z-index: 1;

        @media (max-width: 768px) {
            .top-nav { margin: 8px; padding: 10px 16px; }
            .nav-logo { font-size: 1.1rem; }
            .search-input { min-width: 140px; }
            .links-grid { grid-template-columns: 1fr; gap: 12px; }
            .link-card { padding: 16px; }
            .category-bar { padding: 12px 16px; }
            .cat-tab { padding: 8px 14px; font-size: 0.8rem; }
            .main-container { padding: 0 4% 80px; }
        }
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-mid));
            display: flex; justify-content: center; align-items: center; z-index: 10000;

            width: 80px; height: 80px; border-radius: 24px;
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--glass-shadow);
            animation: loaderPulse 2s infinite ease-in-out;
        }
        .loader-glass i { font-size: 2rem; color: var(--accent); animation: spin 1.5s linear infinite; }
        @keyframes loaderPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

    { id: 'software', name: '💾 软件下载', icon: 'fas fa-download', color: '#2196F3' },
    { id: 'cloud', name: '☁️ 云服务', icon: 'fas fa-cloud', color: '#2196F3' },
];
function renderCategories() {
    const bar = document.getElementById('categoryBar');
    bar.innerHTML = CATEGORIES.map((cat, i) => {
        const count = cat.id === 'all' ? RESOURCES.length : RESOURCES.filter(r => r.category === cat.id).length;
        return `<button class="cat-tab${i===0?' active':''}" data-cat="${cat.id}" onclick="switchCategory('${cat.id}',this)">${cat.name}<span class="count">${count}</span></button>`;
    }).join('');
}
let currentCat = 'all';
function switchCategory(catId, btn) {
    currentCat = catId;
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    if(btn) btn.classList.add('active');
    renderLinks();
}
function renderLinks() {
    const container = document.getElementById('mainContainer');
    const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    let filtered = currentCat === 'all' ? [...RESOURCES] : RESOURCES.filter(r => r.category === currentCat);
    if(keyword){
        filtered = filtered.filter(r =>
            r.name.toLowerCase().includes(keyword) ||
            r.desc.toLowerCase().includes(keyword) ||
            (r.tags && r.tags.some(t => t.toLowerCase().includes(keyword)))
        );
    }
    if(filtered.length === 0){
        container.innerHTML = `<div class="no-results"><i class="fas fa-search"></i><p>没有找到匹配的资源<br><small style="opacity:0.7;">试试其他关键词吧</small></p></div>`;
        return;
    }
    const groups = currentCat === 'all' ? {} : { [currentCat]: filtered };
    if(currentCat === 'all'){
        CATEGORIES.slice(1).forEach(c => {
            const items = filtered.filter(r => r.category === c.id);
            if(items.length > 0) groups[c.id] = items;
        });
    }
    let html = '';
    Object.entries(groups).forEach(([catId, items]) => {
        const catInfo = CATEGORIES.find(c => c.id === catId);
        if(!catInfo) return;
        html += `<section class="category-section"><div class="section-header liquid-glass"><div class="section-icon" style="background:${catInfo.color}"><i class="${catInfo.icon}"></i></div><h2 class="section-title">${catInfo.name}</h2><span class="section-count">${items.length} 个资源</span></div><div class="links-grid">`;
        items.forEach(item => {
            html += `<a href="${item.url}" target="_blank" rel="noopener noreferrer" class="link-card liquid-glass"><div class="card-top"><div class="card-icon" style="background:${item.color}"><i class="${item.icon}"></i></div><span class="card-title">${item.name}</span></div><p class="card-desc">${item.desc}</p>${item.tags?`<div class="card-tags">${item.tags.map(t=>`<span class="card-tag">${t}</span>`).join('')}</div>`:''}</a>`;
        });
        html += `</div></section>`;
    });
    container.innerHTML = html;
}
function filterLinks(){ renderLinks(); }
(function(){
    const btn = document.getElementById('backToTop');
    window.addEventListener('scroll', () => { btn.classList.toggle('visible', window.scrollY > 400); }, {passive:true});
})();
document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        document.getElementById('loadingOverlay').style.opacity = '0';
        setTimeout(() => { document.getElementById('loadingOverlay').style.display = 'none'; }, 800);
    }, 1200);
    document.getElementById('totalCount').textContent = RESOURCES.length;
    renderCategories();
    renderLinks();
});
console.log('%c🔗 LiquidNav 已加载 | 共 ' + RESOURCES.length + ' 个资源', 'color: #4a6fa5; font-size: 14px;');
</script>
