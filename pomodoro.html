<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="图标/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟专注工具 · InfinityCore v1.3.0</title>
    <meta name="description" content="基于番茄工作法的专注计时器，帮助提升学习和工作效率">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ====== 继承核心框架变量 ====== */
        :root {
            --primary: #4a6fa5;
            --primary-dark: #3a5a8a;
            --secondary: #8a9b6e;
            --dark: #2d2d2d;
            --light: #f8f7f4;
            --gray: #6d6d6d;
            --border: #e0ded9;
            --accent: #c7a27c;
            --card-bg: rgba(255, 255, 255, 0.88);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--light);
            color: var(--dark);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景纹理 */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(248,247,244,0.92), rgba(248,247,244,0.92)),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path fill="rgba(199,162,124,0.03)" d="M20,20 Q40,5 60,20 T100,20 Q85,40 100,60 T100,100 Q60,85 20,100 T0,100 Q5,60 0,20 T20,20"/></svg>');
            background-size: cover, 300px;
            z-index: -1; pointer-events: none;
        }

        .container {
            width: 100%; max-width: 480px;
        }

        .header {
            text-align: center; margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 1.8rem; color: var(--dark);
            margin-bottom: 0.5rem; font-weight: 700;
        }
        .header p {
            color: var(--gray); font-size: 0.95rem;
        }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--primary); text-decoration: none;
            font-size: 0.9rem; margin-top: 1rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent); }

        /* 番茄钟主体 */
        .pomodoro-card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 2.5rem;
            box-shadow: 0 12px 40px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.02);
            backdrop-filter: blur(2px);
            text-align: center;
        }

        /* 模式切换 */
        .mode-tabs {
            display: flex; gap: 8px;
            justify-content: center; margin-bottom: 2rem;
        }
        .mode-tab {
            padding: 8px 20px; border: none; border-radius: 20px;
            background: rgba(74,111,165,0.08); color: var(--primary-dark);
            font-size: 0.88rem; font-weight: 500; cursor: pointer;
            transition: all 0.3s ease;
        }
        .mode-tab.active {
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: white; box-shadow: 0 4px 14px rgba(199,162,124,0.3);
        }
        .mode-tab:hover:not(.active) {
            background: rgba(199,162,124,0.15); color: var(--accent);
        }

        /* 圆形计时器 */
        .timer-circle {
            position: relative; width: 240px; height: 240px;
            margin: 0 auto 2rem;
        }
        .timer-svg {
            transform: rotate(-90deg); width: 100%; height: 100%;
        }
        .timer-bg {
            fill: none; stroke: rgba(0,0,0,0.05);
            stroke-width: 6;
        }
        .timer-progress {
            fill: none; stroke: url(#timerGradient);
            stroke-width: 6; stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
        }
        .timer-text {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .time-display {
            font-size: 3.2rem; font-weight: 700;
            color: var(--dark); font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
        }
        .time-label {
            font-size: 0.85rem; color: var(--gray);
            margin-top: 4px;
        }

        /* 控制按钮 */
        .controls {
            display: flex; gap: 12px;
            justify-content: center; margin-bottom: 2rem;
        }
        .ctrl-btn {
            width: 56px; height: 56px; border-radius: 50%;
            border: none; cursor: pointer;
            font-size: 1.2rem; display: flex;
            align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .ctrl-btn.main {
            width: 68px; height: 68px;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: white; box-shadow: 0 6px 20px rgba(199,162,124,0.35);
        }
        .ctrl-btn.main:hover {
            transform: scale(1.08); box-shadow: 0 8px 26px rgba(199,162,124,0.45);
        }
        .ctrl-btn.secondary {
            background: rgba(0,0,0,0.04); color: var(--gray);
        }
        .ctrl-btn.secondary:hover {
            background: rgba(199,162,124,0.12); color: var(--accent);
        }

        /* 设置区域 */
        .settings {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 12px; margin-bottom: 1.5rem;
        }
        .setting-item {
            background: rgba(0,0,0,0.02); border-radius: 14px;
            padding: 14px 10px; text-align: center;
        }
        .setting-label {
            font-size: 0.78rem; color: var(--gray);
            margin-bottom: 6px;
        }
        .setting-value {
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .setting-input {
            width: 48px; padding: 6px; text-align: center;
            border: 1.5px solid var(--border); border-radius: 8px;
            font-size: 0.95rem; font-weight: 600; color: var(--dark);
            background: white; outline: none;
            transition: border-color 0.2s;
        }
        .setting-input:focus {
            border-color: var(--accent);
        }
        .setting-unit {
            font-size: 0.82rem; color: var(--gray);
        }

        /* 统计信息 */
        .stats {
            display: flex; justify-content: center; gap: 20px;
            padding-top: 1.5rem; border-top: 1px solid rgba(0,0,0,0.05);
        }
        .stat-item { text-align: center; }
        .stat-num {
            font-size: 1.4rem; font-weight: 700; color: var(--accent);
        }
        .stat-label {
            font-size: 0.78rem; color: var(--gray);
        }

        /* 任务列表 */
        .task-section {
            margin-top: 1.5rem; text-align: left;
        }
        .task-header {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 10px; font-size: 0.9rem;
            font-weight: 600; color: var(--dark);
        }
        .task-input-wrap {
            display: flex; gap: 8px; margin-bottom: 10px;
        }
        .task-input {
            flex: 1; padding: 10px 14px;
            border: 1.5px solid var(--border); border-radius: 10px;
            font-size: 0.88rem; outline: none;
            transition: border-color 0.2s;
            background: white;
        }
        .task-input:focus { border-color: var(--accent); }
        .task-add-btn {
            padding: 10px 16px; border: none; border-radius: 10px;
            background: var(--primary); color: white;
            font-size: 0.85rem; cursor: pointer;
            transition: all 0.2s;
        }
        .task-add-btn:hover {
            background: var(--primary-dark);
        }
        .task-list { list-style: none; max-height: 160px; overflow-y: auto; }
        .task-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; background: rgba(0,0,0,0.02);
            border-radius: 10px; margin-bottom: 6px;
            font-size: 0.88rem; transition: background 0.2s;
        }
        .task-item:hover { background: rgba(199,162,124,0.06); }
        .task-check {
            width: 18px; height: 18px; border-radius: 50%;
            border: 2px solid var(--border); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
        }
        .task-check.checked {
            background: var(--accent); border-color: var(--accent);
            color: white; font-size: 0.65rem;
        }
        .task-text { flex: 1; }
        .task-text.done { text-decoration: line-through; color: var(--gray); }
        .task-delete {
            color: var(--gray); cursor: pointer; opacity: 0;
            transition: opacity 0.2s; font-size: 0.85rem;
        }
        .task-item:hover .task-delete { opacity: 1; }
        .task-delete:hover { color: #d9534f; }

        /* 响应式 */
        @media (max-width: 480px) {
            .pomodoro-card { padding: 1.8rem; }
            .timer-circle { width: 200px; height: 200px; }
            .time-display { font-size: 2.6rem; }
            .settings { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .setting-input { width: 42px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-clock"></i> 番茄钟专注工具</h1>
            <p>专注工作，高效休息 · Pomodoro Technique</p>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回首页</a>
        </div>

        <div class="pomodoro-card">
            <!-- 模式切换 -->
            <div class="mode-tabs">
                <button class="mode-tab active" data-mode="work">🍅 专注</button>
                <button class="mode-tab" data-mode="shortBreak">☕ 短休息</button>
                <button class="mode-tab" data-mode="longBreak">🌴 长休息</button>
            </div>

            <!-- 计时器 -->
            <div class="timer-circle">
                <svg class="timer-svg" viewBox="0 0 120 120">
                    <defs>
                        <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#c7a27c"/>
                            <stop offset="100%" stop-color="#4a6fa5"/>
                        </linearGradient>
                    </defs>
                    <circle class="timer-bg" cx="60" cy="60" r="54"/>
                    <circle class="timer-progress" id="progressCircle"
                        cx="60" cy="60" r="54"
                        stroke-dasharray="339.292" stroke-dashoffset="0"/>
                </svg>
                <div class="timer-text">
                    <div class="time-display" id="timeDisplay">25:00</div>
                    <div class="time-label" id="timeLabel">准备开始</div>
                </div>
            </div>

            <!-- 控制按钮 -->
            <div class="controls">
                <button class="ctrl-btn secondary" id="resetBtn" title="重置">
                    <i class="fas fa-redo"></i>
                </button>
                <button class="ctrl-btn main" id="startBtn" title="开始/暂停">
                    <i class="fas fa-play" id="playIcon"></i>
                </button>
                <button class="ctrl-btn secondary" id="skipBtn" title="跳过">
                    <i class="fas fa-forward"></i>
                </button>
            </div>

            <!-- 时间设置 -->
            <div class="settings">
                <div class="setting-item">
                    <div class="setting-label">专注时长</div>
                    <div class="setting-value">
                        <input type="number" class="setting-input" id="workTime" value="25" min="1" max="60">
                        <span class="setting-unit">分</span>
                    </div>
                </div>
                <div class="setting-item">
                    <div class="setting-label">短休息</div>
                    <div class="setting-value">
                        <input type="number" class="setting-input" id="shortBreakTime" value="5" min="1" max="30">
                        <span class="setting-unit">分</span>
                    </div>
                </div>
                <div class="setting-item">
                    <div class="setting-label">长休息</div>
                    <div class="setting-value">
                        <input type="number" class="setting-input" id="longBreakTime" value="15" min="1" max="60">
                        <span class="setting-unit">分</span>
                    </div>
                </div>
            </div>

            <!-- 统计 -->
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-num" id="completedPomodoros">0</div>
                    <div class="stat-label">完成番茄</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num" id="totalFocusTime">0<span style="font-size:0.8rem">min</span></div>
                    <div class="stat-label">总专注时间</div>
                </div>
            </div>

            <!-- 任务列表 -->
            <div class="task-section">
                <div class="task-header"><i class="fas fa-tasks"></i> 今日任务</div>
                <div class="task-input-wrap">
                    <input type="text" class="task-input" id="taskInput" placeholder="添加任务...">
                    <button class="task-add-btn" id="addTaskBtn"><i class="fas fa-plus"></i></button>
                </div>
                <ul class="task-list" id="taskList"></ul>
            </div>
        </div>
    </div>

    <script>
    // ====== 番茄钟核心逻辑 ======
    const STATE = {
        work: { time: 25 * 60, label: '专注中...' },
        shortBreak: { time: 5 * 60, label: '短休息中...' },
        longBreak: { time: 15 * 60, label: '长休息中...' }
    };

    let currentMode = 'work';
    let timeLeft = STATE.work.time;
    let isRunning = false;
    let timerInterval = null;
    let completedPomodoros = 0;
    let totalFocusMinutes = 0;

    // DOM元素
    const timeDisplay = document.getElementById('timeDisplay');
    const timeLabel = document.getElementById('timeLabel');
    const progressCircle = document.getElementById('progressCircle');
    const startBtn = document.getElementById('startBtn');
    const playIcon = document.getElementById('playIcon');
    const resetBtn = document.getElementById('resetBtn');
    const skipBtn = document.getElementById('skipBtn');

    const circumference = 2 * Math.PI * 54; // 339.292
    progressCircle.style.strokeDasharray = circumference;

    // 格式化时间
    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    // 更新显示
    function updateDisplay() {
        timeDisplay.textContent = formatTime(timeLeft);
        const totalTime = STATE[currentMode].time;
        const offset = circumference * (1 - timeLeft / totalTime);
        progressCircle.style.strokeDashoffset = offset;
        
        // 更新页面标题
        document.title = `${formatTime(timeLeft)} · ${isRunning ? timeLabel.textContent : '番茄钟'} | InfinityCore`;
    }

    // 切换模式
    function switchMode(mode) {
        currentMode = mode;
        timeLeft = getTimeForMode(mode);
        isRunning = false;
        clearInterval(timerInterval);
        playIcon.className = 'fas fa-play';
        timeLabel.textContent = '准备开始';
        
        // 更新标签状态
        document.querySelectorAll('.mode-tab').forEach(tab => {
            tab.classList.toggle('active', tab.dataset.mode === mode);
        });
        
        updateDisplay();
    }

    function getTimeForMode(mode) {
        if (mode === 'work') return parseInt(document.getElementById('workTime').value) * 60 || 25 * 60;
        if (mode === 'shortBreak') return parseInt(document.getElementById('shortBreakTime').value) * 60 || 5 * 60;
        if (mode === 'longBreak') return parseInt(document.getElementById('longBreakTime').value) * 60 || 15 * 60;
    }

    // 开始/暂停
    startBtn.addEventListener('click', () => {
        if (isRunning) {
            pauseTimer();
        } else {
            startTimer();
        }
    });

    function startTimer() {
        isRunning = true;
        playIcon.className = 'fas fa-pause';
        timeLabel.textContent = STATE[currentMode].label;
        
        timerInterval = setInterval(() => {
            timeLeft--;
            updateDisplay();
            
            if (timeLeft <= 0) {
                completeSession();
            }
        }, 1000);
    }

    function pauseTimer() {
        isRunning = false;
        playIcon.className = 'fas fa-play';
        clearInterval(timerInterval);
        timeLabel.textContent = '已暂停';
    }

    // 完成一个时段
    function completeSession() {
        clearInterval(timerInterval);
        isRunning = false;
        playIcon.className = 'fas fa-play';
        
        // 播放提示音
        playNotificationSound();
        
        if (currentMode === 'work') {
            completedPomodoros++;
            totalFocusMinutes += Math.floor(getTimeForMode('work') / 60);
            document.getElementById('completedPomodoros').textContent = completedPomodoros;
            document.getElementById('totalFocusTime').innerHTML = totalFocusMinutes + '<span style="font-size:0.8rem">min</span>';
            
            // 每4个番茄后长休息
            if (completedPomodoros % 4 === 0) {
                switchMode('longBreak');
            } else {
                switchMode('shortBreak');
            }
        } else {
            switchMode('work');
        }
        
        // 浏览器通知
        showBrowserNotification();
    }

    // 重置
    resetBtn.addEventListener('click', () => {
        clearInterval(timerInterval);
        isRunning = false;
        playIcon.className = 'fas fa-play';
        timeLeft = getTimeForMode(currentMode);
        timeLabel.textContent = '准备开始';
        updateDisplay();
    });

    // 跳过
    skipBtn.addEventListener('click', () => {
        if (currentMode === 'work') {
            completedPomodoros++;
            totalFocusMinutes += Math.floor((getTimeForMode('work') - timeLeft) / 60);
            document.getElementById('completedPomodoros').textContent = completedPomodoros;
            switchMode(completedPomodoros % 4 === 0 ? 'longBreak' : 'shortBreak');
        } else {
            switchMode('work');
        }
    });

    // 模式切换点击
    document.querySelectorAll('.mode-tab').forEach(tab => {
        tab.addEventListener('click', () => switchMode(tab.dataset.mode));
    });

    // 提示音
    function playNotificationSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 800;
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.5);
        } catch(e) {}
    }

    // 浏览器通知
    function showBrowserNotification() {
        if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('番茄钟', {
                body: currentMode === 'work' ? '休息时间到了！' : '该开始专注了！',
                icon: '图标/logo.png'
            });
        }
    }

    // 请求通知权限
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }

    // ====== 任务管理 ======
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');
    const addTaskBtn = document.getElementById('addTaskBtn');
    
    let tasks = JSON.parse(localStorage.getItem('pomodoro_tasks') || '[]');

    function renderTasks() {
        taskList.innerHTML = '';
        tasks.forEach((task, i) => {
            const li = document.createElement('li');
            li.className = 'task-item';
            li.innerHTML = `
                <span class="task-check ${task.done ? 'checked' : ''}" onclick="toggleTask(${i})">${task.done ? '✓' : ''}</span>
                <span class="task-text ${task.done ? 'done' : ''}">${escapeHtml(task.text)}</span>
                <span class="task-delete" onclick="deleteTask(${i})"><i class="fas fa-times"></i></span>
            `;
            taskList.appendChild(li);
        });
        localStorage.setItem('pomodoro_tasks', JSON.stringify(tasks));
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function addTask() {
        const text = taskInput.value.trim();
        if (!text) return;
        tasks.push({ text, done: false });
        taskInput.value = '';
        renderTasks();
    }

    addTaskBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

    window.toggleTask = function(i) {
        tasks[i].done = !tasks[i].done;
        renderTasks();
    };

    window.deleteTask = function(i) {
        tasks.splice(i, 1);
        renderTasks();
    };

    // 初始化
    renderTasks();
    updateDisplay();

    console.log('%c🍅 番茄钟工具已加载 | InfinityCore v1.3.0', 'color: #c7a27c;');
    </script>
</body>
</html>
