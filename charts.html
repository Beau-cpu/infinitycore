<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="图标/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据可视化工具 · InfinityCore v1.3.0</title>
    <meta name="description" content="纯前端数据可视化工具，支持多种图表类型即输即显">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4a6fa5; --primary-dark: #3a5a8a; --secondary: #8a9b6e;
            --dark: #2d2d2d; --light: #f8f7f4; --gray: #6d6d6d;
            --border: #e0ded9; --accent: #c7a27c;
            --card-bg: rgba(255,255,255,0.88);
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
            background:var(--light);color:var(--dark);line-height:1.7;
            min-height:100vh;padding:20px;position:relative;
        }
        body::before{
            content:"";position:fixed;top:0;left:0;width:100%;height:100%;
            background:linear-gradient(rgba(248,247,244,0.92),rgba(248,247,244,0.92)),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><path fill="rgba(199,162,124,0.03)" d="M20,20 Q40,5 60,20 T100,20 Q85,40 100,60 T100,100 Q60,85 20,100 T0,100 Q5,60 0,20 T20,20"/></svg>');
            background-size:cover,300px;z-index:-1;pointer-events:none;
        }
        .container{max-width:1100px;margin:0 auto;}
        .header{text-align:center;margin-bottom:2rem;padding-top:1rem;}
        .header h1{font-size:2rem;color:var(--dark);font-weight:700;margin-bottom:0.5rem;}
        .header p{color:var(--gray);font-size:1rem;}
        .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--primary);text-decoration:none;font-size:0.9rem;margin-top:0.8rem;transition:color 0.2s;}
        .back-link:hover{color:var(--accent);}
        
        .main-layout{display:grid;grid-template-columns:340px 1fr;gap:20px;}
        @media(max-width:900px){.main-layout{grid-template-columns:1fr;}}
        
        .panel{background:var(--card-bg);border-radius:20px;padding:1.5rem;box-shadow:0 8px 30px rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.04);}
        .panel-title{font-size:1.1rem;font-weight:700;color:var(--dark);margin-bottom:1.2rem;display:flex;align-items:center;gap:8px;}
        .panel-title i{color:var(--accent);}
        
        .form-group{margin-bottom:1rem;}
        .form-label{display:block;font-size:0.82rem;color:var(--gray);margin-bottom:6px;font-weight:500;}
        .form-input,.form-textarea,.form-select{
            width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;
            font-size:0.88rem;font-family:inherit;color:var(--dark);outline:none;background:white;transition:border-color 0.2s;
        }
        .form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--accent);}
        .form-textarea{min-height:120px;resize:vertical;line-height:1.6;}
        
        .chart-type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem;}
        .chart-type-btn{
            padding:10px;border:1.5px solid var(--border);border-radius:10px;
            background:transparent;color:var(--gray);cursor:pointer;text-align:center;
            font-size:0.82rem;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:4px;
        }
        .chart-type-btn i{font-size:1.2rem;color:var(--primary);}
        .chart-type-btn.active{border-color:var(--accent);background:rgba(199,162,124,0.08);color:var(--accent);}
        .chart-type-btn.active i{color:var(--accent);}
        .chart-type-btn:hover:not(.active){border-color:var(--primary);background:rgba(74,111,165,0.05);}
        
        .btn-primary{
            width:100%;padding:11px;border:none;border-radius:10px;
            background:linear-gradient(135deg,var(--accent),var(--primary));color:white;
            font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.25s;
        }
        .btn-primary:hover{box-shadow:0 4px 14px rgba(199,162,124,0.35);transform:translateY(-1px);}
        
        .btn-secondary{
            width:100%;padding:10px;border:1.5px solid var(--border);border-radius:10px;
            background:transparent;color:var(--gray);font-size:0.85rem;cursor:pointer;margin-top:8px;transition:all 0.2s;
        }
        .btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
        
        .preview-area{position:relative;background:white;border-radius:16px;padding:1.5rem;min-height:450px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--border);}
        canvas{max-width:100%;}
        .placeholder-text{text-align:center;color:var(--gray);}
        .placeholder-text i{font-size:3rem;color:rgba(199,162,124,0.3);margin-bottom:1rem;display:block;}
        
        .preset-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem;}
        .preset-btn{
            padding:5px 12px;border:1px solid var(--border);border-radius:15px;
            background:transparent;font-size:0.76rem;color:var(--gray);cursor:pointer;transition:all 0.2s;
        }
        .preset-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(199,162,124,0.05);}
        
        .color-picker-row{display:flex;gap:8px;align-items:center;margin-bottom:1rem;}
        .color-picker-wrap{flex:1;}
        .color-picker-wrap label{font-size:0.78rem;color:var(--gray);display:block;margin-bottom:4px;}
        .color-input{width:100%;height:32px;border:1.5px solid var(--border);border-radius:6px;cursor:pointer;padding:2px;}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-chart-pie"></i> 数据可视化工具</h1>
        <p>纯前端图表生成 · 即输即显 · 无需后端</p>
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回首页</a>
    </div>
    
    <div class="main-layout">
        <!-- 左侧控制面板 -->
        <div class="panel">
            <div class="panel-title"><i class="fas fa-sliders-h"></i> 图表配置</div>
            
            <!-- 图表类型 -->
            <div class="form-group">
                <label class="form-label">图表类型</label>
                <div class="chart-type-grid">
                    <button class="chart-type-btn active" data-type="bar"><i class="fas fa-chart-bar"></i>柱状图</button>
                    <button class="chart-type-btn" data-type="line"><i class="fas fa-chart-line"></i>折线图</button>
                    <button class="chart-type-btn" data-type="pie"><i class="fas fa-chart-pie"></i>饼图</button>
                    <button class="chart-type-btn" data-type="radar"><i class="fas fa-spider"></i>雷达图</button>
                    <button class="chart-type-btn" data-type="doughnut"><i class="fas fa-circle-notch"></i>环形图</button>
                    <button class="chart-type-btn" data-type="polarArea"><i class="fas fa-sun"></i>极坐标</button>
                </div>
            </div>
            
            <!-- 标题 -->
            <div class="form-group">
                <label class="form-label">图表标题</label>
                <input type="text" class="form-input" id="chartTitle" placeholder="输入标题..." value="月度销售数据">
            </div>
            
            <!-- 数据标签 -->
            <div class="form-group">
                <label class="form-label">数据标签（逗号分隔）</label>
                <input type="text" class="form-input" id="dataLabels" placeholder="一月, 二月, 三月..." value="一月,二月,三月,四月,五月,六月">
            </div>
            
            <!-- 数据值 -->
            <div class="form-group">
                <label class="form-label">数据值（逗号分隔）</label>
                <input type="text" class="form-input" id="dataValues" placeholder="12, 19, 8, 15..." value="65,59,80,81,56,72">
            </div>
            
            <!-- 颜色方案 -->
            <div class="color-picker-row">
                <div class="color-picker-wrap">
                    <label>主色调</label><input type="color" class="color-input" id="primaryColor" value="#c7a27c">
                </div>
                <div class="color-picker-wrap">
                    <label>辅助色</label><input type="color" class="color-input" id="secondaryColor" value="#4a6fa5">
                </div>
            </div>
            
            <!-- 预设数据 -->
            <div class="form-group">
                <label class="form-label">快速预设</label>
                <div class="preset-btns">
                    <button class="preset-btn" onclick="loadPreset('sales')">📊 销售数据</button>
                    <button class="preset-btn" onclick="loadPreset('traffic')">🌐 流量统计</button>
                    <button class="preset-btn" onclick="loadPreset('score')">📝 成绩分布</button>
                    <button class="preset-btn" onclick="loadPreset('survey')">📋 调查结果</button>
                </div>
            </div>
            
            <button class="btn-primary" onclick="renderChart()"><i class="fas fa-magic"></i> 生成图表</button>
            <button class="btn-secondary" onclick="downloadChart()"><i class="fas fa-download"></i> 下载图片</button>
        </div>
        
        <!-- 右侧预览区 -->
        <div class="panel">
            <div class="panel-title"><i class="fas fa-eye"></i> 图表预览</div>
            <div class="preview-area" id="previewArea">
                <canvas id="chartCanvas"></canvas>
                <div class="placeholder-text" id="placeholderText" style="display:none;">
                    <i class="fas fa-chart-area"></i>
                    <p>配置参数后点击「生成图表」</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
let chartInstance = null;
let currentType = 'bar';

// 图表类型切换
document.querySelectorAll('.chart-type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.chart-type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentType = btn.dataset.type;
    });
});

// 渲染图表
function renderChart() {
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');
    
    // 销毁旧实例
    if (chartInstance) chartInstance.destroy();
    
    const title = document.getElementById('chartTitle').value || '未命名图表';
    const labels = document.getElementById('dataLabels').value.split(',').map(s=>s.trim()).filter(Boolean);
    const valuesStr = document.getElementById('dataValues').value.split(',').map(s=>s.trim());
    const values = valuesStr.map(v => parseFloat(v)).filter(v => !isNaN(v));
    const primaryColor = document.getElementById('primaryColor').value;
    const secondaryColor = document.getElementById('secondaryColor').value;
    
    if (labels.length === 0 || values.length === 0) {
        alert('请填写有效的标签和数据值！');
        return;
    }
    
    // 生成颜色数组
    function generateColors(count) {
        const colors = [];
        for(let i=0;i<count;i++){
            const ratio = i/(count-1||1);
            colors.push(interpolateColor(primaryColor, secondaryColor, ratio));
        }
        return colors;
    }
    
    function interpolateColor(c1,c2,r){
        const r1=parseInt(c1.slice(1,3),16), g1=parseInt(c1.slice(3,5),16), b1=parseInt(c1.slice(5,7),16);
        const r2=parseInt(c2.slice(1,3),16), g2=parseInt(c2.slice(3,5),16), b2=parseInt(c2.slice(5,7),16);
        const rr=Math.round(r1+(r2-r1)*r), gg=Math.round(g1+(g2-g1)*r), bb=Math.round(b1+(b2-b1)*r);
        return `rgb(${rr},${gg},${bb})`;
    }
    
    const bgColors = generateColors(values.length);
    const borderColors = bgColors.map(c => c.replace('rgb','rgba').replace(')', ',0.8)'));
    
    const commonData = {
        labels,
        datasets: [{
            label: title,
            data: values,
            backgroundColor: ['pie','doughnut','polarArea'].includes(currentType)
                ? bgColors.map(c => c.replace('rgb','rgba').replace(')', ',0.7)'))
                : primaryColor + '33',
            borderColor: ['pie','doughnut','polarArea'].includes(currentType)
                ? bgColors.map(c => c.replace('rgb','rgba').replace(')', ')'))
                : primaryColor,
            borderWidth: 2,
            fill: currentType === 'line',
            tension: 0.35,
            pointBackgroundColor: secondaryColor,
            pointBorderColor: '#fff',
            pointRadius: currentType==='line'?5:0,
            pointHoverRadius: currentType==='line'?7:0,
        }]
    };
    
    const options = {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
            legend: { display: ['pie','doughnut','polarArea'].includes(currentType), position: 'bottom' },
            title: { display: !!title, text: title, font: { size: 16, family: "'Segoe UI',sans-serif", weight: '600' }, color: '#2d2d2d', padding: 16 }
        },
        scales: ['bar','line','radar'].includes(currentType) ? {
            y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { color: '#6d6d6d' } },
            x: { grid: { display: false }, ticks: { color: '#6d6d6d' } }
        } : undefined
    };
    
    chartInstance = new Chart(ctx, { type: currentType, data: commonData, options });
}

// 预设数据
function loadPreset(type) {
    const presets = {
        sales:   { title:'月度销售数据', labels:'一月,二月,三月,四月,五月,六月', values:'65,59,80,81,56,72' },
        traffic: { title:'周访问量趋势', labels:'周一,周二,周三,周四,周五,周六,周日', values:'1200,1900,1700,2100,2400,1800,1400' },
        score:   { title:'班级成绩分布', labels:'优秀,良好,中等,及格,不及格', values:'12,25,18,8,3' },
        survey:  { title:'用户满意度调查', values:'非常满意,满意,一般,不满意,非常不满意', values:'42,38,15,4,1' }
    };
    const p = presets[type] || presets.sales;
    document.getElementById('chartTitle').value = p.title;
    document.getElementById('dataLabels').value = p.labels;
    document.getElementById('dataValues').value = p.values;
    renderChart();
}

// 下载图表
function downloadChart(){
    if(!chartInstance){alert('请先生成图表！');return;}
    const link=document.createElement('a');
    link.download='chart-'+currentType+'-'+Date.now()+'.png';
    link.href=document.getElementById('chartCanvas').toDataURL('image/png');
    link.click();
}

// 初始渲染
window.addEventListener('DOMContentLoaded',()=>renderChart());

console.log('%c📊 数据可视化工具已加载 | InfinityCore v1.3.0', 'color: #8a9b6e;');
</script>
</body>
</html>
