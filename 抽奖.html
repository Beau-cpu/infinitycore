<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="图标/logo.png"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专业随机抽奖系统 - InfinityCore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #4a6fa5;
            --primary-dark: #3a5a8a;
            --secondary: #8a9b6e;
            --dark: #2d2d2d;
            --light: #f8f7f4;
            --gray: #6d6d6d;
            --border: #e0ded9;
            --accent: #c7a27c;
            --success: #5cb85c;
            --warning: #f0ad4e;
            --danger: #d9534f;
            --info: #5bc0de;
            --card-bg: rgba(255, 255, 255, 0.95);
            --transition: all 0.3s ease;
        }
        
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: var(--dark);
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* 主容器 */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 25px;
            min-height: calc(100vh - 40px);
        }
        
        /* 面板通用样式 */
        .panel {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 25px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }
        
        /* 标题样式 */
        h1 {
            font-size: 2rem;
            color: var(--dark);
            font-weight: 700;
            margin-bottom: 8px;
            position: relative;
            padding-bottom: 12px;
        }
        
        h1::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 4px;
            background: linear-gradient(to right, var(--accent), var(--primary));
            border-radius: 2px;
        }
        
        .subtitle {
            color: var(--gray);
            margin-bottom: 20px;
            font-size: 1rem;
            line-height: 1.5;
        }
        
        h3 {
            font-size: 1.1rem;
            color: var(--primary);
            margin: 18px 0 12px 0;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* 分区样式 */
        .section {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        
        /* 文件上传区域 */
        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .upload-card {
            background: linear-gradient(145deg, #f8f9fa, #ffffff);
            border-radius: 10px;
            padding: 20px;
            border: 2px dashed var(--border);
            transition: var(--transition);
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 140px;
        }
        
        .upload-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .upload-card i {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }
        
        .upload-card h4 {
            font-size: 1rem;
            margin-bottom: 6px;
            color: var(--dark);
        }
        
        .upload-card p {
            font-size: 0.85rem;
            color: var(--gray);
            line-height: 1.4;
        }
        
        .file-input {
            display: none;
        }
        
        /* 模板下载 */
        .template-section {
            text-align: center;
            padding: 12px;
        }
        
        .template-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(to right, var(--secondary), #7a8b60);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        
        /* 手动输入区域 */
        .manual-input-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .textarea-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .manual-textarea {
            flex: 1;
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            resize: none;
            transition: var(--transition);
            line-height: 1.5;
        }
        
        .manual-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.1);
        }
        
        .textarea-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--gray);
        }
        
        /* 数据控制按钮 */
        .data-controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        
        .control-button {
            flex: 1;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 500;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .control-button.primary {
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            color: white;
        }
        
        .control-button.secondary {
            background: rgba(0, 0, 0, 0.05);
            color: var(--dark);
        }
        
        .control-button.danger {
            background: rgba(217, 83, 79, 0.1);
            color: var(--danger);
        }
        
        .control-button.success {
            background: rgba(92, 184, 92, 0.1);
            color: var(--success);
        }
        
        .control-button:hover {
            transform: translateY(-2px);
        }
        
        /* 数据显示 */
        .data-info-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to right, #f8f9fa, #ffffff);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-top: 16px;
        }
        
        .data-count {
            font-size: 1rem;
            font-weight: 600;
        }
        
        .data-count span {
            color: var(--primary);
            font-size: 1.2rem;
        }
        
        .data-status {
            font-size: 0.85rem;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 500;
        }
        
        .status-success {
            background: rgba(92, 184, 92, 0.15);
            color: var(--success);
        }
        
        .status-warning {
            background: rgba(240, 173, 78, 0.15);
            color: var(--warning);
        }
        
        /* 抽奖结果显示区域 */
        .result-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #f8f9fa, #ffffff);
            border-radius: 16px;
            padding: 30px;
            margin: 16px 0;
            border: 1px solid var(--border);
            min-height: 250px;
        }
        
        .result-text {
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            line-height: 1.3;
            transition: all 0.3s ease;
            word-break: break-word;
            max-width: 100%;
        }
        
        .result-text.rolling {
            animation: rollingEffect 0.1s infinite;
            color: var(--accent);
        }
        
        @keyframes rollingEffect {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-2px) rotate(0.5deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(2px) rotate(-0.5deg); }
        }
        
        .result-placeholder {
            font-size: 1.4rem;
            color: var(--gray);
            text-align: center;
            opacity: 0.7;
        }
        
        /* 抽奖控制 */
        .draw-controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .draw-settings {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        
        .number-selector {
            background: rgba(255, 255, 255, 0.9);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        .number-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .number-button {
            width: 45px;
            height: 45px;
            border: 2px solid var(--border);
            background: white;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--dark);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .number-button:hover {
            border-color: var(--primary);
        }
        
        .number-button.active {
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            color: white;
            border-color: var(--primary);
        }
        
        .mode-selector {
            background: rgba(255, 255, 255, 0.9);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        .mode-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        
        .mode-button {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid var(--border);
            background: white;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--dark);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .mode-button:hover {
            border-color: var(--primary);
        }
        
        .mode-button.active {
            background: linear-gradient(to right, var(--secondary), #7a8b60);
            color: white;
            border-color: var(--secondary);
        }
        
        .draw-button {
            padding: 18px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .draw-button:hover {
            transform: translateY(-2px);
        }
        
        .draw-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .draw-button:disabled:hover {
            transform: none;
        }
        
        .draw-button.rolling {
            background: linear-gradient(to right, var(--danger), #c9302c);
        }
        
        /* 历史记录 */
        .history-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 200px;
        }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .history-list {
            flex: 1;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 12px;
            border: 1px solid var(--border);
            max-height: 200px;
        }
        
        .history-item {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }
        
        .history-result {
            font-weight: 500;
            color: var(--dark);
            font-size: 0.95rem;
        }
        
        .history-time {
            font-size: 0.8rem;
            color: var(--gray);
        }
        
        .clear-history {
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 5px 10px;
            border-radius: 6px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* 消息提示 */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 500;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            transform: translateX(100%);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 350px;
        }
        
        .message.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        .message.success {
            background: var(--success);
            color: white;
        }
        
        .message.warning {
            background: var(--warning);
            color: white;
        }
        
        .message.error {
            background: var(--danger);
            color: white;
        }
        
        .message.info {
            background: var(--info);
            color: white;
        }
        
        /* 移动端适配 */
        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .upload-section {
                grid-template-columns: 1fr;
            }
            
            .result-text {
                font-size: 2.5rem;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .panel {
                padding: 20px;
                border-radius: 12px;
            }
            
            h1 {
                font-size: 1.7rem;
            }
            
            .section {
                padding: 15px;
            }
            
            .upload-card {
                padding: 18px;
                min-height: 130px;
            }
            
            .data-controls {
                flex-direction: column;
            }
            
            .result-text {
                font-size: 2rem;
            }
            
            .number-buttons {
                justify-content: center;
            }
            
            .number-button {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            
            .draw-button {
                padding: 16px 24px;
                font-size: 1.1rem;
            }
            
            .mode-button {
                padding: 8px 12px;
                font-size: 0.9rem;
            }
        }
        
        /* 统计数据 */
        .stats-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
        }
        
        .stat-card {
            background: linear-gradient(145deg, #f8f9fa, #ffffff);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: var(--gray);
        }
        
        /* 自定义数字输入 */
        .custom-number {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .custom-number input {
            width: 70px;
            padding: 8px 10px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: center;
        }
        
        .custom-number input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        /* 导出结果按钮 */
        .export-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            background: linear-gradient(to right, var(--secondary), #7a8b60);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }
        
        /* 重置名单按钮 */
        .reset-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            background: linear-gradient(to right, var(--warning), #ec971f);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }
        
        /* 加载动画 - 变体一：无限符号旋转 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        
        .loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .loader-container {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .apple-loader {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top: 4px solid var(--accent);
            border-right: 4px solid var(--accent);
            animation: spin 1.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }
        
        .apple-loader-inner {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary);
            border-right: 3px solid var(--primary);
            animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite reverse;
        }
        
        .apple-loader-core {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 30px rgba(74, 111, 165, 0.3);
            animation: pulse 2s infinite ease-in-out;
        }
        
        .apple-loader-core::after {
            content: "∞";
            font-size: 40px;
            font-weight: 700;
            color: white;
            animation: rotate 4s infinite linear;
        }
        
        .loader-text {
            margin-top: 30px;
            font-size: 18px;
            font-weight: 500;
            color: var(--gray);
            letter-spacing: 2px;
            animation: text-pulse 2s infinite;
        }
        
        /* 动画关键帧 */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes rotate {
            to { transform: rotate(360deg); }
        }
        
        @keyframes text-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        /* 装饰元素 */
        .floating-element {
            position: fixed;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            opacity: 0.08;
            z-index: -1;
            animation: floatElement 15s infinite ease-in-out;
        }
        
        .floating-element:nth-child(1) {
            top: 10%;
            left: 5%;
            width: 80px;
            height: 80px;
            animation-delay: 0s;
        }
        
        .floating-element:nth-child(2) {
            top: 60%;
            right: 5%;
            width: 60px;
            height: 60px;
            animation-delay: -5s;
        }
        
        .floating-element:nth-child(3) {
            bottom: 20%;
            left: 10%;
            width: 40px;
            height: 40px;
            animation-delay: -10s;
        }
        
        @keyframes floatElement {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(120deg); }
            66% { transform: translateY(15px) rotate(240deg); }
        }
        
        /* 名单预览 */
        .preview-section {
            max-height: 150px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.02);
            border-radius: 8px;
            padding: 8px;
            margin-top: 8px;
            border: 1px solid var(--border);
            display: none;
        }
        
        .preview-item {
            padding: 4px 8px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 0.85rem;
        }
        
        .preview-item:last-child {
            border-bottom: none;
        }
        
        /* 文件处理状态指示器 */
        .processing-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1001;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        
        .processing-indicator.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        .processing-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <!-- 装饰元素 -->
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    
    <!-- 消息提示容器 -->
    <div id="messageContainer"></div>
    
    <!-- 文件处理状态指示器 -->
    <div class="processing-indicator" id="processingIndicator">
        <div class="processing-spinner"></div>
        <span>正在处理文件...</span>
    </div>
    
    <!-- 加载动画 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader-container">
            <div class="apple-loader"></div>
            <div class="apple-loader-inner"></div>
            <div class="apple-loader-core"></div>
        </div>
        <div class="loader-text" id="loaderText">加载中</div>
    </div>
    
    <!-- 主容器 -->
    <div class="main-container">
        <!-- 左侧面板：数据管理 -->
        <div class="panel left-panel">
            <h1>随机抽奖系统</h1>
            <p class="subtitle">上传或输入抽奖名单，支持多种格式导入，公平公正随机抽取</p>
            
            <!-- 文件上传区域 -->
            <div class="section">
                <h3><i class="fas fa-file-upload"></i>上传名单文件</h3>
                <p style="color: var(--gray); margin-bottom: 12px; font-size: 0.9rem;">支持TXT、CSV、Excel格式，每行一个名字</p>
                
                <div class="upload-section">
                    <!-- TXT文件上传 -->
                    <div class="upload-card" onclick="document.getElementById('txtFileInput').click()">
                        <i class="fas fa-file-alt"></i>
                        <h4>TXT文件</h4>
                        <p>纯文本文件，每行一个名字</p>
                        <input type="file" id="txtFileInput" class="file-input" accept=".txt" onchange="handleTxtFileUpload(event)">
                    </div>
                    
                    <!-- Excel/CSV文件上传 -->
                    <div class="upload-card" onclick="document.getElementById('excelFileInput').click()">
                        <i class="fas fa-file-excel"></i>
                        <h4>Excel/CSV文件</h4>
                        <p>支持Excel和CSV格式文件</p>
                        <input type="file" id="excelFileInput" class="file-input" accept=".csv,.xlsx,.xls" onchange="handleExcelFileUpload(event)">
                    </div>
                </div>
                
                <!-- 模板下载 -->
                <div class="template-section">
                    <button class="template-button" onclick="downloadTemplate()">
                        <i class="fas fa-download"></i>
                        <span>下载模板文件</span>
                    </button>
                </div>
            </div>
            
            <!-- 手动输入区域 -->
            <div class="section manual-input-section">
                <h3><i class="fas fa-keyboard"></i>手动输入名单</h3>
                <div class="textarea-container">
                    <textarea 
                        id="manualDataInput" 
                        class="manual-textarea" 
                        placeholder="请输入抽奖名单，每行一个名字&#10;例如：&#10;张三&#10;李四&#10;王五"
                        rows="6"
                    ></textarea>
                    <div class="textarea-info">
                        <span id="lineCount">0 行</span>

            <!-- 数据控制按钮 -->
            <div class="data-controls">
                <button class="control-button primary" onclick="updateFromManualData()">
                    <i class="fas fa-sync-alt"></i>
                    <span>更新名单</span>
                </button>
                <button class="control-button success" onclick="loadExampleData()">
                    <i class="fas fa-magic"></i>
                    <span>示例数据</span>
                </button>
                <button class="control-button secondary" onclick="clearManualData()">
                    <i class="fas fa-eraser"></i>
                    <span>清空输入</span>
                </button>
                <button class="control-button danger" onclick="clearAllData()">
                    <i class="fas fa-trash-alt"></i>
                    <span>清空所有</span>
                </button>
            </div>
            
            <!-- 数据信息显示 -->
            <div class="data-info-display">
                <div class="data-count">当前名单：<span id="currentCount">0</span> 人</div>
                <div class="data-status status-warning" id="dataStatus">等待数据</div>
            </div>
            
            <!-- 统计数据 -->
            <div class="stats-section">
                <div class="stat-card">
                    <div class="stat-value" id="totalDraws">0</div>
                    <div class="stat-label">总抽取次数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="uniqueWinners">0</div>
                    <div class="stat-label">唯一获奖者</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="remainingCount">0</div>
                    <div class="stat-label">剩余人数</div>
                </div>
            </div>
        </div>
        
        <!-- 右侧面板：抽奖显示 -->
        <div class="panel right-panel">
            <!-- 抽奖结果显示 -->
            <div class="result-display">
                <div id="resultText" class="result-text result-placeholder">
                    请先上传或输入抽奖名单
                </div>
                <div id="resultSubtext" style="margin-top: 12px; color: var(--gray); text-align: center; font-size: 1rem;"></div>
            </div>
            
            <!-- 抽奖控制 -->
            <div class="section draw-controls">
                <h3><i class="fas fa-sliders-h"></i>抽奖设置</h3>
                
                <div class="draw-settings">
                    <!-- 抽取人数设置 -->
                    <div class="number-selector">
                        <div style="font-weight: 500; color: var(--dark); margin-bottom: 8px;">抽取人数：</div>
                        <div class="number-buttons">
                            <div class="number-button active" onclick="selectNumber(1)">1</div>
                            <div class="number-button" onclick="selectNumber(2)">2</div>
                            <div class="number-button" onclick="selectNumber(3)">3</div>
                            <div class="number-button" onclick="selectNumber(5)">5</div>
                            <div class="number-button" onclick="selectNumber(10)">10</div>
                        </div>
                        <div class="custom-number">
                            <span>自定义：</span>
                            <input type="number" id="customNumber" min="1" max="100" value="1" onchange="selectCustomNumber()">
                            <span>人</span>
                        </div>
                    </div>
                    
                    <!-- 抽取模式设置 -->
                    <div class="mode-selector">
                        <div style="font-weight: 500; color: var(--dark); margin-bottom: 8px;">抽取模式：</div>
                        <div class="mode-buttons">
                            <button class="mode-button active" onclick="selectMode('normal')">
                                <i class="fas fa-random"></i>
                                <span>普通模式</span>
                            </button>
                            <button class="mode-button" onclick="selectMode('noRepeat')">
                                <i class="fas fa-user-check"></i>
                                <span>不重复</span>
                            </button>
                        </div>
                        <div style="font-size: 0.85rem; color: var(--gray); margin-top: 8px; line-height: 1.4;">
                            <i class="fas fa-info-circle"></i>
                            <span id="modeDescription">每次抽取独立，获奖者可重复</span>
                        </div>
                    </div>
                </div>
                
                <button class="draw-button" id="drawButton" onclick="toggleRolling()" disabled>
                    <i class="fas fa-dice" id="drawIcon"></i>
                    <span id="drawText">开始抽取</span>
                </button>
                
                <!-- 控制按钮组 -->
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button class="export-button" id="exportButton" onclick="exportResults()" disabled>
                        <i class="fas fa-file-export"></i>
                        <span>导出结果</span>
                    </button>
                    <button class="reset-button" id="resetButton" onclick="resetList()" disabled>
                        <i class="fas fa-redo"></i>
                        <span>重置名单</span>
                    </button>

            <!-- 历史记录 -->
            <div class="section history-section">
                <div class="history-header">
                    <h3><i class="fas fa-history"></i>抽奖历史</h3>
                    <button class="clear-history" onclick="clearHistory()">
                        <i class="fas fa-trash"></i>
                        清空记录
                    </button>
                </div>
                <div class="history-list" id="historyList">
                    <div style="text-align: center; color: var(--gray); padding: 30px 0;">暂无抽奖记录</div>
                </div>
            </div>
        </div>

    <!-- 引入xlsx库用于解析Excel文件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script>
        // 抽奖数据
        let students = [];
        let originalStudents = []; // 原始名单备份
        let intervalId = null;
        let isRunning = false;
        let selectedNum = 1;
        let drawHistory = [];
        let drawMode = 'normal'; // 'normal' 或 'noRepeat'
        let drawStats = {
            totalDraws: 0,
            uniqueWinners: new Set(),
            remainingCount: 0
        };
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 监听手动输入区域的变化
            document.getElementById('manualDataInput').addEventListener('input', function() {
                updateLineCount();
            });
            
            // 初始化自定义数字输入
            document.getElementById('customNumber').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    selectCustomNumber();
                }
            });
            
            // 页面加载时显示加载动画
            showLoading('系统初始化中...');
            
            // 延迟加载示例数据，让用户能看到加载动画
            setTimeout(() => {
                loadExampleData();
                hideLoading();
            }, 1500);
            
            // 更新数据统计
            updateStatsDisplay();
        });
        
        // 显示加载动画
        function showLoading(text = '加载中') {
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loaderText = document.getElementById('loaderText');
            
            loaderText.textContent = text;
            loadingOverlay.classList.add('active');
        }
        
        // 隐藏加载动画
        function hideLoading() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.remove('active');
        }
        
        // 显示处理状态指示器
        function showProcessingIndicator(text = '正在处理文件...') {
            const indicator = document.getElementById('processingIndicator');
            const span = indicator.querySelector('span');
            span.textContent = text;
            indicator.classList.add('active');
        }
        
        // 隐藏处理状态指示器
        function hideProcessingIndicator() {
            const indicator = document.getElementById('processingIndicator');
            indicator.classList.remove('active');
        }
        
        // 更新行数和字符数统计
        function updateLineCount() {
            const textarea = document.getElementById('manualDataInput');
            const text = textarea.value;
            const lines = text.split('\n').filter(line => line.trim() !== '');
            document.getElementById('lineCount').textContent = lines.length + ' 行';
            document.getElementById('charCount').textContent = text.length + ' 字符';
        }
        
        // 选择抽取人数
        function selectNumber(num) {
            selectedNum = num;
            document.getElementById('customNumber').value = num;
            
            // 更新按钮状态
            document.querySelectorAll('.number-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            showMessage(`已设置抽取 ${num} 人`, 'success');
        }
        
        // 选择自定义数字
        function selectCustomNumber() {
            const input = document.getElementById('customNumber');
            let num = parseInt(input.value);
            
            if (isNaN(num) || num < 1) {
                num = 1;
                input.value = 1;
            }
            
            if (num > 100) {
                num = 100;
                input.value = 100;
            }
            
            selectedNum = num;
            
            // 更新按钮状态
            document.querySelectorAll('.number-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            showMessage(`已设置抽取 ${num} 人`, 'success');
        }
        
        // 选择抽取模式
        function selectMode(mode) {
            drawMode = mode;
            
            // 更新按钮状态
            document.querySelectorAll('.mode-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 更新模式描述
            const modeDescription = document.getElementById('modeDescription');
            if (mode === 'normal') {
                modeDescription.textContent = '每次抽取独立，获奖者可重复中奖';
                document.getElementById('resetButton').disabled = true;
            } else if (mode === 'noRepeat') {
                modeDescription.textContent = '已获奖者将移出名单，避免重复中奖';
                document.getElementById('resetButton').disabled = false;
            }
            
            showMessage(`已切换到${mode === 'normal' ? '普通模式' : '不重复模式'}`, 'info');
            updateDataDisplay();
        }
        
        // 开始/停止抽取
        function toggleRolling() {
            const drawButton = document.getElementById('drawButton');
            const drawText = document.getElementById('drawText');
            const drawIcon = document.getElementById('drawIcon');
            
            if (isRunning) {
                // 停止抽取
                stopRolling();
                drawText.textContent = '开始抽取';
                drawIcon.className = 'fas fa-dice';
                drawButton.classList.remove('rolling');
            } else {
                // 开始抽取
                if (students.length === 0) {
                    showMessage('请先上传或输入抽奖名单', 'warning');
                    return;
                }
                
                // 检查抽取人数
                if (selectedNum <= 0) {
                    showMessage('请设置有效的抽取人数', 'warning');
                    return;
                }
                
                // 不重复模式检查
                if (drawMode === 'noRepeat' && selectedNum > students.length) {
                    showMessage(`剩余人数不足（剩余${students.length}人），请减少抽取人数或重置名单`, 'error');
                    return;
                }
                
                startRolling();
                drawText.textContent = '停止抽取';
                drawIcon.className = 'fas fa-stop';
                drawButton.classList.add('rolling');
            }
            isRunning = !isRunning;
        }
        
        // 开始抽取
        function startRolling() {
            if (intervalId) clearInterval(intervalId);
            
            const resultText = document.getElementById('resultText');
            resultText.className = 'result-text rolling';
            
            intervalId = setInterval(() => {
                const selectedStudents = getRandomStudents(selectedNum);
                resultText.textContent = selectedStudents.join(', ');
                
                // 更新子文本显示
                const subtext = document.getElementById('resultSubtext');
                if (drawMode === 'noRepeat') {
                    subtext.textContent = `剩余 ${students.length} 人未中奖`;
                } else {
                    subtext.textContent = `名单中共 ${students.length} 人`;
                }
            }, 50);
        }
        
        // 停止抽取
        function stopRolling() {
            if (intervalId) clearInterval(intervalId);
            intervalId = null;
            
            const resultText = document.getElementById('resultText');
            resultText.className = 'result-text';
            
            // 获取最终结果
            const winners = resultText.textContent.split(', ');
            
            // 更新统计数据
            drawStats.totalDraws++;
            winners.forEach(winner => {
                if (winner && !winner.includes('请先')) {
                    drawStats.uniqueWinners.add(winner);
                }
            });
            
            // 更新统计显示
            updateStatsDisplay();
            
            // 保存到历史记录
            saveToHistory(resultText.textContent);
            
            // 如果不重复模式，从名单中移除获奖者
            if (drawMode === 'noRepeat' && resultText.textContent && !resultText.textContent.includes('请先')) {
                removeWinnersFromList(winners);
            }
            
            // 启用导出按钮
            document.getElementById('exportButton').disabled = false;
        }
        
        // 从名单中移除获奖者（不重复模式）
        function removeWinnersFromList(winners) {
            winners.forEach(winner => {
                const index = students.indexOf(winner);
                if (index !== -1) {
                    students.splice(index, 1);
                }
            });
            
            // 更新剩余人数
            drawStats.remainingCount = students.length;
            updateDataDisplay();
            updateStatsDisplay();
            
            // 如果名单空了，提示用户
            if (students.length === 0) {
                showMessage('所有人员都已抽中！请重置名单继续抽取', 'warning');
                document.getElementById('drawButton').disabled = true;
            }
        }
        
        // 获取随机学生
        function getRandomStudents(count) {
            if (students.length === 0) return ["请先上传名单数据"];
            
            // 如果抽取数量大于等于总数，直接返回所有学生
            if (count >= students.length) {
                return [...students];
            }
            
            const selectedStudents = [];
            const tempStudents = [...students]; // 创建副本
            
            // 随机抽取指定数量的学生
            while (selectedStudents.length < count) {
                const randomIndex = Math.floor(Math.random() * tempStudents.length);
                selectedStudents.push(tempStudents[randomIndex]);
                
                // 如果是不重复模式，从临时数组中移除已选中的学生
                if (drawMode === 'noRepeat') {
                    tempStudents.splice(randomIndex, 1);
                }
            }
            
            return selectedStudents;
        }
        
        // 处理TXT文件上传
        function handleTxtFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (!file.name.toLowerCase().endsWith('.txt')) {
                showMessage('请上传TXT格式的文件', 'error');
                event.target.value = '';
                return;
            }
            
            showProcessingIndicator('正在读取TXT文件...');
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    parseTxtData(content);
                    showMessage(`TXT文件加载成功，共 ${students.length} 个名字`, 'success');
                } catch (error) {
                    showMessage('TXT文件读取失败', 'error');
                    console.error('TXT文件读取错误:', error);
                } finally {
                    event.target.value = '';
                    hideProcessingIndicator();
                }
            };
            
            reader.onerror = function() {
                showMessage('文件读取失败，请重试', 'error');
                event.target.value = '';
                hideProcessingIndicator();
            };
            
            reader.readAsText(file, 'UTF-8');
        }
        
        // 处理Excel文件上传
        function handleExcelFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const fileName = file.name.toLowerCase();
            const isExcel = fileName.endsWith('.xlsx') || fileName.endsWith('.xls');
            const isCsv = fileName.endsWith('.csv');
            
            if (!isExcel && !isCsv) {
                showMessage('请上传Excel或CSV格式的文件', 'error');
                event.target.value = '';
                return;
            }
            
            showProcessingIndicator(`正在解析${isExcel ? 'Excel' : 'CSV'}文件...`);
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = e.target.result;
                    
                    if (isExcel) {
                        parseExcelData(data);
                    } else {
                        parseCsvData(data);
                    }
                    
                    showMessage(`文件加载成功，共 ${students.length} 个名字`, 'success');
                } catch (error) {
                    showMessage('文件解析失败，请检查文件格式', 'error');
                    console.error('文件解析错误:', error);
                } finally {
                    event.target.value = '';
                    hideProcessingIndicator();
                }
            };
            
            reader.onerror = function() {
                showMessage('文件读取失败，请重试', 'error');
                event.target.value = '';
                hideProcessingIndicator();
            };
            
            if (isExcel) {
                reader.readAsArrayBuffer(file);
            } else {
                reader.readAsText(file, 'UTF-8');
            }
        }
        
        // 解析TXT数据
        function parseTxtData(content) {
            // 显示加载动画
            showLoading('正在解析名单数据...');
            
            // 按行分割，过滤空行和空白字符
            const lines = content.split(/\r?\n/)
                .map(line => line.trim())
                .filter(line => line.length > 0);
            
            if (lines.length === 0) {
                hideLoading();
                showMessage('TXT文件中没有找到有效数据', 'warning');
                return;
            }
            
            // 模拟数据处理延迟
            setTimeout(() => {
                // 去重并更新学生名单
                students = [...new Set(lines)];
                originalStudents = [...students];
                drawStats.remainingCount = students.length;
                
                // 更新显示
                updateDataDisplay();
                
                // 更新手动输入区域
                document.getElementById('manualDataInput').value = lines.join('\n');
                updateLineCount();
                
                hideLoading();
            }, 800);
        }
        
        // 解析CSV数据
        function parseCsvData(content) {
            // 显示加载动画
            showLoading('正在解析CSV数据...');
            
            // 简单的CSV解析
            const lines = content.split(/\r?\n/)
                .map(line => {
                    // 处理引号
                    if (line.includes('"')) {
                        const matches = line.match(/"[^"]+"/g);
                        if (matches && matches.length > 0) {
                            return matches[0].replace(/"/g, '').trim();
                        }
                    }
                    
                    // 按逗号分割，取第一列
                    const parts = line.split(',');
                    return parts[0] ? parts[0].trim() : '';
                })
                .filter(name => name.length > 0 && name.toLowerCase() !== 'name' && name.toLowerCase() !== '姓名');
            
            if (lines.length === 0) {
                hideLoading();
                showMessage('CSV文件中没有找到有效数据', 'warning');
                return;
            }
            
            // 模拟数据处理延迟
            setTimeout(() => {
                // 去重并更新学生名单
                students = [...new Set(lines)];
                originalStudents = [...students];
                drawStats.remainingCount = students.length;
                
                // 更新显示
                updateDataDisplay();
                
                // 更新手动输入区域
                document.getElementById('manualDataInput').value = lines.join('\n');
                updateLineCount();
                
                hideLoading();
            }, 800);
        }
        
        // 解析Excel数据
        function parseExcelData(data) {
            showLoading('正在解析Excel数据...');
            
            setTimeout(() => {
                try {
                    // 使用xlsx库解析Excel
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    // 获取第一个工作表
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    // 将工作表转换为JSON
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    
                    // 提取第一列数据
                    const names = [];
                    for (let i = 0; i < jsonData.length; i++) {
                        if (jsonData[i] && jsonData[i][0]) {
                            const name = String(jsonData[i][0]).trim();
                            if (name && name.length > 0) {
                                // 跳过可能的标题行
                                if (i === 0 && (
                                    name.toLowerCase().includes('name') || 
                                    name.toLowerCase().includes('姓名') ||
                                    name.toLowerCase().includes('名字')
                                )) {
                                    continue;
                                }
                                names.push(name);
                            }
                        }
                    }
                    
                    if (names.length === 0) {
                        hideLoading();
                        showMessage('Excel文件中没有找到有效数据', 'warning');
                        return;
                    }
                    
                    // 去重并更新学生名单
                    students = [...new Set(names)];
                    originalStudents = [...students];
                    drawStats.remainingCount = students.length;
                    
                    // 更新显示
                    updateDataDisplay();
                    
                    // 更新手动输入区域
                    document.getElementById('manualDataInput').value = names.join('\n');
                    updateLineCount();
                    
                    hideLoading();
                } catch (error) {
                    console.error('Excel解析错误:', error);
                    hideLoading();
                    showMessage('Excel文件解析失败', 'error');
                }
            }, 1000);
        }
        
        // 从手动输入更新数据
        function updateFromManualData() {
            const manualInput = document.getElementById('manualDataInput');
            const content = manualInput.value.trim();
            
            if (!content) {
                showMessage('请输入抽奖名单数据', 'warning');
                return;
            }
            
            showLoading('正在更新名单...');
            
            setTimeout(() => {
                parseTxtData(content);
                showMessage(`手动输入已更新，共 ${students.length} 个名字`, 'success');
            }, 600);
        }
        
        // 加载示例数据
        function loadExampleData() {
            showLoading('正在加载示例数据...');
            
            setTimeout(() => {
                const exampleData = `张三
李四
王五
赵六
钱七
孙八
周九
吴十
郑十一
王十二
刘十三
陈十四
杨十五
黄十六
赵十七
周十八
吴十九
郑二十`;
                
                document.getElementById('manualDataInput').value = exampleData;
                parseTxtData(exampleData);
                showMessage('示例数据已加载，共 18 个名字', 'info');
            }, 1000);
        }
        
        // 清空手动输入数据
        function clearManualData() {
            if (document.getElementById('manualDataInput').value.trim() === '') {
                showMessage('输入区域已经是空的', 'info');
                return;
            }
            
            if (confirm('确定要清空手动输入的数据吗？')) {
                document.getElementById('manualDataInput').value = '';
                updateLineCount();
                showMessage('手动输入已清空', 'success');
            }
        }
        
        // 清空所有数据
        function clearAllData() {
            if (students.length === 0 && document.getElementById('manualDataInput').value.trim() === '' && drawHistory.length === 0) {
                showMessage('当前没有数据可清空', 'info');
                return;
            }
            
            if (confirm('确定要清空所有抽奖数据和历史记录吗？此操作不可撤销。')) {
                showLoading('正在清空数据...');
                
                setTimeout(() => {
                    students = [];
                    originalStudents = [];
                    drawHistory = [];
                    drawStats = {
                        totalDraws: 0,
                        uniqueWinners: new Set(),
                        remainingCount: 0
                    };
                    
                    document.getElementById('manualDataInput').value = '';
                    document.getElementById('resultText').textContent = '请先上传或输入抽奖名单';
                    document.getElementById('resultText').className = 'result-text result-placeholder';
                    document.getElementById('resultSubtext').textContent = '';
                    document.getElementById('drawButton').disabled = true;
                    document.getElementById('exportButton').disabled = true;
                    document.getElementById('resetButton').disabled = true;
                    
                    updateDataDisplay();
                    updateHistoryDisplay();
                    updateLineCount();
                    updateStatsDisplay();
                    
                    // 如果正在抽取，停止抽取
                    if (isRunning) {
                        stopRolling();
                        isRunning = false;
                        document.getElementById('drawText').textContent = '开始抽取';
                        document.getElementById('drawIcon').className = 'fas fa-dice';
                        document.getElementById('drawButton').classList.remove('rolling');
                    }
                    
                    hideLoading();
                    showMessage('所有数据已清空', 'success');
                }, 800);
            }
        }
        
        // 重置名单（恢复所有人员）
        function resetList() {
            if (originalStudents.length === 0) {
                showMessage('没有原始名单可重置', 'warning');
                return;
            }
            
            showLoading('正在重置名单...');
            
            setTimeout(() => {
                students = [...originalStudents];
                drawStats.remainingCount = students.length;
                updateDataDisplay();
                updateStatsDisplay();
                document.getElementById('drawButton').disabled = false;
                hideLoading();
                showMessage('名单已重置，可以继续抽取', 'success');
            }, 600);
        }
        
        // 保存抽奖结果到历史记录
        function saveToHistory(result) {
            if (!result || result.includes('请先')) {
                return;
            }
            
            const now = new Date();
            const timeString = now.toLocaleTimeString('zh-CN', { 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit'
            });
            
            const dateString = now.toLocaleDateString('zh-CN');
            
            drawHistory.unshift({
                result: result,
                time: timeString,
                date: dateString
            });
            
            // 限制历史记录数量
            if (drawHistory.length > 50) {
                drawHistory = drawHistory.slice(0, 50);
            }
            
            updateHistoryDisplay();
        }
        
        // 更新历史记录显示
        function updateHistoryDisplay() {
            const historyList = document.getElementById('historyList');
            
            if (drawHistory.length === 0) {
                historyList.innerHTML = '<div style="text-align: center; color: var(--gray); padding: 30px 0;">暂无抽奖记录</div>';
                return;
            }
            
            let historyHTML = '';
            drawHistory.forEach((item, index) => {
                historyHTML += `
                    <div class="history-item">
                        <div class="history-result">${index + 1}. ${item.result}</div>
                        <div class="history-time">${item.time}</div>
                    </div>
                `;
            });
            
            historyList.innerHTML = historyHTML;
        }
        
        // 清空历史记录
        function clearHistory() {
            if (drawHistory.length === 0) {
                showMessage('历史记录已经是空的', 'info');
                return;
            }
            
            if (confirm('确定要清空所有抽奖历史记录吗？')) {
                drawHistory = [];
                updateHistoryDisplay();
                document.getElementById('exportButton').disabled = true;
                showMessage('历史记录已清空', 'success');
            }
        }
        
        // 更新数据显示
        function updateDataDisplay() {
            const countElement = document.getElementById('currentCount');
            const statusElement = document.getElementById('dataStatus');
            const drawButton = document.getElementById('drawButton');
            
            countElement.textContent = students.length;
            
            if (students.length === 0) {
                statusElement.textContent = '等待数据';
                statusElement.className = 'data-status status-warning';
                drawButton.disabled = true;
                document.getElementById('resultText').textContent = '请先上传或输入抽奖名单';
                document.getElementById('resultText').className = 'result-text result-placeholder';
                document.getElementById('resultSubtext').textContent = '';
            } else {
                statusElement.textContent = `已加载 ${students.length} 个名字`;
                statusElement.className = 'data-status status-success';
                drawButton.disabled = false;
                
                // 更新显示区域
                document.getElementById('resultText').textContent = `已加载 ${students.length} 个名字`;
                document.getElementById('resultText').className = 'result-text';
                
                const subtext = document.getElementById('resultSubtext');
                if (drawMode === 'noRepeat') {
                    subtext.textContent = `不重复模式，剩余 ${students.length} 人未中奖`;
                } else {
                    subtext.textContent = `普通模式，点击开始按钮进行随机抽取`;
                }
            }
            
            // 更新重置按钮状态
            document.getElementById('resetButton').disabled = drawMode !== 'noRepeat';
        }
        
        // 更新统计数据
        function updateStatsDisplay() {
            document.getElementById('totalDraws').textContent = drawStats.totalDraws;
            document.getElementById('uniqueWinners').textContent = drawStats.uniqueWinners.size;
            document.getElementById('remainingCount').textContent = drawStats.remainingCount;
        }
        
        // 显示消息提示
        function showMessage(text, type) {
            const messageContainer = document.getElementById('messageContainer');
            
            // 创建消息元素
            const messageEl = document.createElement('div');
            messageEl.className = `message ${type}`;
            
            // 添加图标
            let icon = '';
            switch(type) {
                case 'success': icon = 'fas fa-check-circle'; break;
                case 'warning': icon = 'fas fa-exclamation-triangle'; break;
                case 'error': icon = 'fas fa-times-circle'; break;
                case 'info': icon = 'fas fa-info-circle'; break;
                default: icon = 'fas fa-info-circle';
            }
            
            messageEl.innerHTML = `<i class="${icon}"></i><span>${text}</span>`;
            
            messageContainer.appendChild(messageEl);
            
            // 显示动画
            setTimeout(() => {
                messageEl.classList.add('show');
            }, 10);
            
            // 3秒后自动消失
            setTimeout(() => {
                messageEl.classList.remove('show');
                setTimeout(() => {
                    if (messageEl.parentNode) {
                        messageEl.parentNode.removeChild(messageEl);
                    }
                }, 300);
            }, 3000);
        }
        
        // 下载模板文件
        function downloadTemplate() {
            showLoading('正在生成模板...');
            
            setTimeout(() => {
                // 创建CSV模板
                const csvContent = "姓名\n张三\n李四\n王五\n赵六\n钱七\n孙八\n周九\n吴十";
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = '抽奖名单模板.csv';
                link.click();
                
                hideLoading();
                showMessage('CSV模板下载成功', 'success');
            }, 600);
        }
        
        // 导出抽奖结果
        function exportResults() {
            if (drawHistory.length === 0) {
                showMessage('没有抽奖记录可以导出', 'warning');
                return;
            }
            
            showLoading('正在生成导出文件...');
            
            setTimeout(() => {
                // 创建导出内容
                let exportContent = '抽奖结果记录\n';
                exportContent += '生成时间: ' + new Date().toLocaleString('zh-CN') + '\n';
                exportContent += '抽奖模式: ' + (drawMode === 'normal' ? '普通模式' : '不重复模式') + '\n';
                exportContent += '名单总数: ' + originalStudents.length + ' 人\n';
                exportContent += '剩余人数: ' + students.length + ' 人\n';
                exportContent += '总抽取次数: ' + drawStats.totalDraws + '\n';
                exportContent += '唯一获奖者: ' + drawStats.uniqueWinners.size + ' 人\n';
                exportContent += '='.repeat(50) + '\n\n';
                exportContent += '抽奖历史记录:\n\n';
                
                drawHistory.forEach((item, index) => {
                    exportContent += `${index + 1}. ${item.result} (${item.date} ${item.time})\n`;
                });
                
                // 创建文件并下载
                const blob = new Blob([exportContent], { type: 'text/plain;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `抽奖结果_${new Date().getTime()}.txt`;
                link.click();
                
                hideLoading();
                showMessage('抽奖结果已导出', 'success');
            }, 800);
        }
        
        // 添加键盘快捷键
        document.addEventListener('keydown', function(e) {
            // 空格键开始/停止抽取
            if (e.code === 'Space' && !e.target.matches('textarea, input')) {
                e.preventDefault();
                const drawButton = document.getElementById('drawButton');
                if (!drawButton.disabled) {
                    toggleRolling();
                }
            }
        });
    </script>
</body>
</html>
