<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="图标/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>专业随机抽奖系统 - InfinityCore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============================================================
                   核心变量 & 重置
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4a6fa5;
            --primary-dark: #3a5a8a;
            --secondary: #8a9b6e;
            --dark: #2d2d2d;
            --light: #f8f7f4;
            --gray: #6d6d6d;
            --border: #e0ded9;
            --accent: #c7a27c;
            --success: #5cb85c;
            --warning: #f0ad4e;
            --danger: #d9534f;
            --info: #5bc0de;
            --card-bg: rgba(255, 255, 255, 0.95);
            --transition: all 0.3s ease;
            --radius: 16px;
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --touch-target: 44px;
        }

        body {
            font-family: var(--font);
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: var(--dark);
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============================================================
                   装饰元素（共用）
                   ============================================================ */
        .floating-element {
            position: fixed;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            opacity: 0.06;
            z-index: -1;
            animation: floatElement 15s infinite ease-in-out;
        }
        .floating-element:nth-child(1) {
            top: 10%;
            left: 5%;
            width: 80px;
            height: 80px;
            animation-delay: 0s;
        }
        .floating-element:nth-child(2) {
            top: 60%;
            right: 5%;
            width: 60px;
            height: 60px;
            animation-delay: -5s;
        }
        .floating-element:nth-child(3) {
            bottom: 20%;
            left: 10%;
            width: 40px;
            height: 40px;
            animation-delay: -10s;
        }

        @keyframes floatElement {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            33% {
                transform: translateY(-20px) rotate(120deg);
            }
            66% {
                transform: translateY(15px) rotate(240deg);
            }
        }

        /* ============================================================
                   消息 & Toast（共用）
                   ============================================================ */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 500;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            transform: translateX(100%);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 350px;
        }
        .message.show {
            transform: translateX(0);
            opacity: 1;
        }
        .message.success {
            background: var(--success);
            color: white;
        }
        .message.warning {
            background: var(--warning);
            color: white;
        }
        .message.error {
            background: var(--danger);
            color: white;
        }
        .message.info {
            background: var(--info);
            color: white;
        }

        .processing-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1001;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .processing-indicator.active {
            opacity: 1;
            transform: translateY(0);
        }
        .processing-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* ============================================================
                   加载动画（共用）
                   ============================================================ */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .loader-container {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .apple-loader {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top: 4px solid var(--accent);
            border-right: 4px solid var(--accent);
            animation: spin 1.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }
        .apple-loader-inner {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary);
            border-right: 3px solid var(--primary);
            animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite reverse;
        }
        .apple-loader-core {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 30px rgba(74, 111, 165, 0.3);
            animation: pulse 2s infinite ease-in-out;
        }
        .apple-loader-core::after {
            content: "∞";
            font-size: 40px;
            font-weight: 700;
            color: white;
            animation: rotate 4s infinite linear;
        }
        .loader-text {
            margin-top: 30px;
            font-size: 18px;
            font-weight: 500;
            color: var(--gray);
            letter-spacing: 2px;
            animation: text-pulse 2s infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes text-pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        /* ============================================================
                   布局 — 横屏 (≥ 900px) 两栏
                   ============================================================ */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 40px);
        }

        /* 横屏：两栏网格 */
        @media (min-width: 900px) {
            .main-container {
                display: grid;
                grid-template-columns: 1fr 1.3fr;
                gap: 25px;
            }

            .panel {
                background: var(--card-bg);
                border-radius: var(--radius);
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
                padding: 28px 30px;
                display: flex;
                flex-direction: column;
                border: 1px solid rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(10px);
                overflow: hidden;
                transition: var(--transition);
            }

            .panel:hover {
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10);
            }

            /* 左侧面板滚动 — 统一渐变色滚动条 */
            .left-panel {
                max-height: calc(100vh - 60px);
                overflow-y: auto;
            }
            .left-panel::-webkit-scrollbar {
                width: 6px;
            }
            .left-panel::-webkit-scrollbar-track {
                background: transparent;
            }
            .left-panel::-webkit-scrollbar-thumb {
                background: linear-gradient(var(--accent), var(--primary));
                border-radius: 4px;
            }
            .left-panel::-webkit-scrollbar-thumb:hover {
                background: var(--primary-dark);
            }

            h1 {
                font-size: 2rem;
                color: var(--dark);
                font-weight: 700;
                margin-bottom: 6px;
                position: relative;
                padding-bottom: 12px;
            }
            h1::after {
                content: "";
                position: absolute;
                bottom: 0;
                left: 0;
                width: 50px;
                height: 4px;
                background: linear-gradient(to right, var(--accent), var(--primary));
                border-radius: 2px;
            }

            .subtitle {
                color: var(--gray);
                margin-bottom: 18px;
                font-size: 0.95rem;
                line-height: 1.5;
            }

            .section {
                background: rgba(255, 255, 255, 0.9);
                border-radius: 12px;
                padding: 18px 20px;
                margin-bottom: 14px;
                border: 1px solid var(--border);
            }

            .upload-section {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }

            .upload-card {
                background: linear-gradient(145deg, #f8f9fa, #ffffff);
                border-radius: 10px;
                padding: 18px 16px;
                border: 2px dashed var(--border);
                transition: var(--transition);
                cursor: pointer;
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 130px;
            }
            .upload-card:hover {
                border-color: var(--primary);
                transform: translateY(-2px);
            }
            .upload-card i {
                font-size: 1.8rem;
                color: var(--primary);
                margin-bottom: 8px;
            }
            .upload-card h4 {
                font-size: 0.95rem;
                margin-bottom: 4px;
                color: var(--dark);
            }
            .upload-card p {
                font-size: 0.8rem;
                color: var(--gray);
                line-height: 1.4;
            }

            .manual-textarea {
                min-height: 120px;
            }

            .data-controls {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }
            .data-controls .control-button {
                flex: 1;
                min-width: 80px;
                padding: 10px 14px;
                font-size: 0.9rem;
            }

            .result-text {
                font-size: 3.2rem;
            }

            .stats-section {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }

            .draw-settings {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }

            .number-buttons {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
            }
            .number-button {
                width: 42px;
                height: 42px;
            }

            .history-list {
                max-height: 180px;
            }
        }

        /* ============================================================
                   布局 — 竖屏 (< 900px) 单栏
                   ============================================================ */
        @media (max-width: 899px) {
            .main-container {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .panel {
                background: var(--card-bg);
                border-radius: 14px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
                padding: 20px 18px;
                border: 1px solid rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(10px);
                overflow: hidden;
            }

            h1 {
                font-size: 1.7rem;
                color: var(--dark);
                font-weight: 700;
                margin-bottom: 4px;
                position: relative;
                padding-bottom: 10px;
            }
            h1::after {
                content: "";
                position: absolute;
                bottom: 0;
                left: 0;
                width: 40px;
                height: 3px;
                background: linear-gradient(to right, var(--accent), var(--primary));
                border-radius: 2px;
            }

            .subtitle {
                color: var(--gray);
                margin-bottom: 14px;
                font-size: 0.9rem;
                line-height: 1.5;
            }

            .section {
                background: rgba(255, 255, 255, 0.9);
                border-radius: 12px;
                padding: 14px 16px;
                margin-bottom: 12px;
                border: 1px solid var(--border);
            }

            .upload-section {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .upload-card {
                background: linear-gradient(145deg, #f8f9fa, #ffffff);
                border-radius: 10px;
                padding: 14px 12px;
                border: 2px dashed var(--border);
                transition: var(--transition);
                cursor: pointer;
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 110px;
            }
            .upload-card i {
                font-size: 1.5rem;
                color: var(--primary);
                margin-bottom: 6px;
            }
            .upload-card h4 {
                font-size: 0.85rem;
                margin-bottom: 2px;
                color: var(--dark);
            }
            .upload-card p {
                font-size: 0.75rem;
                color: var(--gray);
                line-height: 1.3;
            }

            .manual-textarea {
                min-height: 100px;
                font-size: 0.9rem;
            }

            .data-controls {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .data-controls .control-button {
                padding: 10px 12px;
                font-size: 0.85rem;
                min-height: var(--touch-target);
            }
            .data-controls .control-button:last-child {
                grid-column: span 2;
            }

            .result-text {
                font-size: 2.4rem;
            }

            .stats-section {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .stat-value {
                font-size: 1.3rem;
            }
            .stat-label {
                font-size: 0.75rem;
            }

            .draw-settings {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .number-buttons {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .number-button {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            .custom-number {
                justify-content: center;
            }
            .custom-number input {
                width: 60px;
            }

            .mode-buttons {
                display: flex;
                gap: 8px;
            }
            .mode-button {
                flex: 1;
                padding: 8px 12px;
                font-size: 0.85rem;
                min-height: var(--touch-target);
            }

            .draw-button {
                padding: 16px 24px;
                font-size: 1.1rem;
                min-height: var(--touch-target);
            }

            .history-list {
                max-height: 150px;
            }

            /* 竖屏时右侧面板的顺序调整（通过flex order） */
            .right-panel {
                display: flex;
                flex-direction: column;
            }
            .right-panel .result-display {
                order: -2;
            }
            .right-panel .draw-controls {
                order: -1;
            }
            .right-panel .history-section {
                order: 0;
            }

            /* 导出和重置按钮在竖屏时并排 */
            .right-panel .draw-controls>div:last-child {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .right-panel .draw-controls>div:last-child button {
                margin-top: 0;
            }
        }

        /* ============================================================
                   小屏手机 (≤ 480px) 进一步压缩
                   ============================================================ */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .panel {
                padding: 14px 12px;
                border-radius: 12px;
            }
            h1 {
                font-size: 1.4rem;
            }
            .subtitle {
                font-size: 0.8rem;
                margin-bottom: 10px;
            }
            .section {
                padding: 10px 12px;
                margin-bottom: 8px;
                border-radius: 10px;
            }
            .upload-section {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .upload-card {
                min-height: 90px;
                padding: 12px;
            }
            .upload-card i {
                font-size: 1.3rem;
            }
            .upload-card h4 {
                font-size: 0.8rem;
            }
            .upload-card p {
                font-size: 0.7rem;
            }
            .manual-textarea {
                min-height: 80px;
                font-size: 0.85rem;
                padding: 10px;
            }
            .data-controls {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .data-controls .control-button {
                padding: 8px 10px;
                font-size: 0.8rem;
                min-height: 38px;
            }
            .data-info-display {
                padding: 8px 12px;
                font-size: 0.85rem;
                flex-wrap: wrap;
                gap: 6px;
            }
            .result-text {
                font-size: 2rem;
            }
            .stats-section {
                gap: 6px;
            }
            .stat-value {
                font-size: 1.1rem;
            }
            .stat-label {
                font-size: 0.7rem;
            }
            .number-button {
                width: 36px;
                height: 36px;
                font-size: 0.9rem;
            }
            .mode-button {
                font-size: 0.78rem;
                padding: 6px 10px;
                min-height: 36px;
            }
            .draw-button {
                padding: 14px 20px;
                font-size: 1rem;
                min-height: 48px;
            }
            .history-list {
                max-height: 120px;
                padding: 8px;
            }
            .history-item {
                padding: 6px 8px;
                font-size: 0.8rem;
            }
            .template-button {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            .message {
                max-width: 280px;
                font-size: 0.85rem;
                padding: 10px 16px;
                top: 12px;
                right: 12px;
            }
            .processing-indicator {
                padding: 8px 14px;
                font-size: 0.8rem;
                bottom: 12px;
                right: 12px;
            }
            .loader-container {
                width: 140px;
                height: 140px;
            }
            .apple-loader-inner {
                width: 110px;
                height: 110px;
            }
            .apple-loader-core {
                width: 80px;
                height: 80px;
            }
            .apple-loader-core::after {
                font-size: 30px;
            }
            .loader-text {
                font-size: 15px;
                margin-top: 20px;
            }
            .right-panel .draw-controls>div:last-child {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
        }

        /* ============================================================
                   通用样式（所有屏幕）
                   ============================================================ */
        .file-input {
            display: none;
        }

        .template-section {
            text-align: center;
            padding: 8px 0 4px;
        }
        .template-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(to right, var(--secondary), #7a8b60);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            font-family: var(--font);
        }
        .template-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(138, 155, 110, 0.3);
        }

        .manual-input-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .textarea-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .manual-textarea {
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            font-family: var(--font);
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            resize: vertical;
            transition: var(--transition);
            line-height: 1.5;
            color: var(--dark);
        }
        .manual-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.1);
        }
        .textarea-info {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--gray);
        }

        .control-button {
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 500;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: var(--font);
        }
        .control-button.primary {
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            color: white;
        }
        .control-button.secondary {
            background: rgba(0, 0, 0, 0.05);
            color: var(--dark);
        }
        .control-button.danger {
            background: rgba(217, 83, 79, 0.1);
            color: var(--danger);
        }
        .control-button.success {
            background: rgba(92, 184, 92, 0.1);
            color: var(--success);
        }
        .control-button:hover {
            transform: translateY(-2px);
        }
        .control-button:active {
            transform: scale(0.96);
        }

        .data-info-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to right, #f8f9fa, #ffffff);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .data-count {
            font-size: 1rem;
            font-weight: 600;
        }
        .data-count span {
            color: var(--primary);
            font-size: 1.2rem;
        }
        .data-status {
            font-size: 0.85rem;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 500;
        }
        .status-success {
            background: rgba(92, 184, 92, 0.15);
            color: var(--success);
        }
        .status-warning {
            background: rgba(240, 173, 78, 0.15);
            color: var(--warning);
        }

        .result-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #f8f9fa, #ffffff);
            border-radius: 16px;
            padding: 24px 20px;
            margin: 12px 0 16px;
            border: 1px solid var(--border);
            min-height: 200px;
        }
        .result-text {
            font-weight: 700;
            color: var(--primary);
            text-align: center;

</head>
<body>
    <!-- 装饰元素 -->
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    <div class="floating-element"></div>

    <!-- 消息提示容器 -->
    <div id="messageContainer"></div>

    <!-- 文件处理状态指示器 -->
    <div class="processing-indicator" id="processingIndicator">
        <div class="processing-spinner"></div>
        <span>正在处理文件...</span>
    </div>

    <!-- 加载动画 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader-container">
            <div class="apple-loader"></div>
            <div class="apple-loader-inner"></div>
            <div class="apple-loader-core"></div>
        </div>
        <div class="loader-text" id="loaderText">加载中</div>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 左侧面板：数据管理 -->
        <div class="panel left-panel">
            <h1>随机抽奖系统</h1>
            <p class="subtitle">上传或输入抽奖名单，支持多种格式导入，公平公正随机抽取</p>

            <!-- 文件上传区域 -->
            <div class="section">
                <h3><i class="fas fa-file-upload"></i>上传名单文件</h3>
                <p style="color: var(--gray); margin-bottom: 10px; font-size: 0.85rem;">支持TXT、CSV、Excel格式，每行一个名字</p>

                <div class="upload-section">
                    <div class="upload-card" onclick="document.getElementById('txtFileInput').click()">
                        <i class="fas fa-file-alt"></i>
                        <h4>TXT文件</h4>
                        <p>纯文本文件，每行一个名字</p>
                        <input type="file" id="txtFileInput" class="file-input" accept=".txt" onchange="handleTxtFileUpload(event)">
                    </div>
                    <div class="upload-card" onclick="document.getElementById('excelFileInput').click()">
                        <i class="fas fa-file-excel"></i>
                        <h4>Excel/CSV文件</h4>
                        <p>支持Excel和CSV格式文件</p>
                        <input type="file" id="excelFileInput" class="file-input" accept=".csv,.xlsx,.xls" onchange="handleExcelFileUpload(event)">
                    </div>
                </div>

                <div class="template-section">
                    <button class="template-button" onclick="downloadTemplate()">
                        <i class="fas fa-download"></i>
                        <span>下载模板文件</span>
                    </button>
                </div>
            </div>

            <!-- 手动输入区域 -->
            <div class="section manual-input-section">
                <h3><i class="fas fa-keyboard"></i>手动输入名单</h3>
                <div class="textarea-container">
                    <textarea id="manualDataInput" class="manual-textarea" placeholder="请输入抽奖名单，每行一个名字&#10;例如：&#10;张三&#10;李四&#10;王五" rows="5"></textarea>
                    <div class="textarea-info">
                        <span id="lineCount">0 行</span>
                        <span id="charCount">0 字符</span>
                    </div>
                </div>
            </div>

            <!-- 数据控制按钮 -->
            <div class="data-controls">
                <button class="control-button primary" onclick="updateFromManualData()">
                    <i class="fas fa-sync-alt"></i>
                    <span>更新名单</span>
                </button>
                <button class="control-button success" onclick="loadExampleData()">
                    <i class="fas fa-magic"></i>
                    <span>示例数据</span>
                </button>
                <button class="control-button secondary" onclick="clearManualData()">
                    <i class="fas fa-eraser"></i>
                    <span>清空输入</span>
                </button>
                <button class="control-button danger" onclick="clearAllData()">
                    <i class="fas fa-trash-alt"></i>
                    <span>清空所有</span>
                </button>
            </div>

            <!-- 数据信息显示 -->
            <div class="data-info-display">
                <div class="data-count">当前名单：<span id="currentCount">0</span> 人</div>
                <div class="data-status status-warning" id="dataStatus">等待数据</div>
            </div>

            <!-- 统计数据 -->
            <div class="stats-section">
                <div class="stat-card">
                    <div class="stat-value" id="totalDraws">0</div>
                    <div class="stat-label">总抽取次数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="uniqueWinners">0</div>
                    <div class="stat-label">唯一获奖者</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="remainingCount">0</div>
                    <div class="stat-label">剩余人数</div>
                </div>
            </div>
        </div>

        <!-- 右侧面板：抽奖显示 -->
        <div class="panel right-panel">
            <!-- 抽奖结果显示 -->
            <div class="result-display">
                <div id="resultText" class="result-text result-placeholder">
                    请先上传或输入抽奖名单
                </div>
                <div id="resultSubtext" style="margin-top: 10px; color: var(--gray); text-align: center; font-size: 0.9rem;"></div>
            </div>

            <!-- 抽奖控制 -->
            <div class="section draw-controls">
                <h3><i class="fas fa-sliders-h"></i>抽奖设置</h3>

                <div class="draw-settings">
                    <div class="number-selector">
                        <div>抽取人数：</div>
                        <div class="number-buttons">
                            <div class="number-button active" onclick="selectNumber(1, this)">1</div>
                            <div class="number-button" onclick="selectNumber(2, this)">2</div>
                            <div class="number-button" onclick="selectNumber(3, this)">3</div>
                            <div class="number-button" onclick="selectNumber(5, this)">5</div>
                            <div class="number-button" onclick="selectNumber(10, this)">10</div>
                        </div>
                        <div class="custom-number">
                            <span>自定义：</span>
                            <input type="number" id="customNumber" min="1" max="100" value="1" onchange="selectCustomNumber()">
                            <span>人</span>
                        </div>
                    </div>

                    <div class="mode-selector">
                        <div>抽取模式：</div>
                        <div class="mode-buttons">
                            <button class="mode-button active" onclick="selectMode('normal', this)">
                                <i class="fas fa-random"></i>
                                <span>普通模式</span>
                            </button>
                            <button class="mode-button" onclick="selectMode('noRepeat', this)">
                                <i class="fas fa-user-check"></i>
                                <span>不重复</span>
                            </button>
                        </div>
                        <div class="mode-description">
                            <i class="fas fa-info-circle"></i>
                            <span id="modeDescription">每次抽取独立，获奖者可重复中奖</span>
                        </div>
                    </div>
                </div>

                <button class="draw-button" id="drawButton" onclick="toggleRolling()" disabled>
                    <i class="fas fa-dice" id="drawIcon"></i>
                    <span id="drawText">开始抽取</span>
                </button>

                <div style="display: flex; gap: 10px; margin-top: 4px;">
                    <button class="export-button" id="exportButton" onclick="exportResults()" disabled>
                        <i class="fas fa-file-export"></i>
                        <span>导出结果</span>
                    </button>
                    <button class="reset-button" id="resetButton" onclick="resetList()" disabled>
                        <i class="fas fa-redo"></i>
                        <span>重置名单</span>
                    </button>
                </div>
            </div>

            <!-- 历史记录 -->
            <div class="section history-section">
                <div class="history-header">
                    <h3><i class="fas fa-history"></i>抽奖历史</h3>
                    <button class="clear-history" onclick="clearHistory()">
                        <i class="fas fa-trash"></i>
                        清空记录
                    </button>
                </div>
                <div class="history-list" id="historyList">
                    <div style="text-align: center; color: var(--gray); padding: 25px 0; font-size: 0.9rem;">暂无抽奖记录</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入xlsx库用于解析Excel文件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>

    <script>
        // ================================================================
        //  抽奖核心逻辑（完全保留原功能，未做任何修改）
        // ================================================================

        let students = [];
        let originalStudents = [];
        let intervalId = null;
        let isRunning = false;
        let selectedNum = 1;
        let drawHistory = [];
        let drawMode = 'normal';
        let drawStats = {
            totalDraws: 0,
            uniqueWinners: new Set(),
            remainingCount: 0
        };

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('manualDataInput').addEventListener('input', function() {
                updateLineCount();
            });
            document.getElementById('customNumber').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    selectCustomNumber();
                }
            });
            showLoading('系统初始化中...');
            setTimeout(() => {
                loadExampleData();
                hideLoading();
            }, 1500);
            updateStatsDisplay();
        });

        function showLoading(text) {
            document.getElementById('loaderText').textContent = text || '加载中';
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        function showProcessingIndicator(text) {
            const el = document.getElementById('processingIndicator');
            el.querySelector('span').textContent = text || '正在处理文件...';
            el.classList.add('active');
        }

        function hideProcessingIndicator() {
            document.getElementById('processingIndicator').classList.remove('active');
        }

        function updateLineCount() {
            const textarea = document.getElementById('manualDataInput');
            const text = textarea.value;
            const lines = text.split('\n').filter(line => line.trim() !== '');
            document.getElementById('lineCount').textContent = lines.length + ' 行';
            document.getElementById('charCount').textContent = text.length + ' 字符';
        }

        function selectNumber(num, btn) {
            selectedNum = num;
            document.getElementById('customNumber').value = num;
            document.querySelectorAll('.number-button').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            showMessage(`已设置抽取 ${num} 人`, 'success');
        }

        function selectCustomNumber() {
            const input = document.getElementById('customNumber');
            let num = parseInt(input.value);
            if (isNaN(num) || num < 1) { num = 1;
                input.value = 1; }
            if (num > 100) { num = 100;
                input.value = 100; }
            selectedNum = num;
            document.querySelectorAll('.number-button').forEach(b => b.classList.remove('active'));
            showMessage(`已设置抽取 ${num} 人`, 'success');
        }

        function selectMode(mode, btn) {
            drawMode = mode;
            document.querySelectorAll('.mode-button').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            const desc = document.getElementById('modeDescription');
            if (mode === 'normal') {
                desc.textContent = '每次抽取独立，获奖者可重复中奖';
                document.getElementById('resetButton').disabled = true;
            } else {
                desc.textContent = '已获奖者将移出名单，避免重复中奖';
                document.getElementById('resetButton').disabled = false;
            }
            showMessage(`已切换到${mode === 'normal' ? '普通模式' : '不重复模式'}`, 'info');
            updateDataDisplay();
        }

        function toggleRolling() {
            const btn = document.getElementById('drawButton');
            const text = document.getElementById('drawText');
            const icon = document.getElementById('drawIcon');
            if (isRunning) {
                stopRolling();
                text.textContent = '开始抽取';
                icon.className = 'fas fa-dice';
                btn.classList.remove('rolling');
            } else {
                if (students.length === 0) {
                    showMessage('请先上传或输入抽奖名单', 'warning');
                    return;
                }
                if (selectedNum <= 0) {
                    showMessage('请设置有效的抽取人数', 'warning');
                    return;
                }
                if (drawMode === 'noRepeat' && selectedNum > students.length) {
                    showMessage(`剩余人数不足（剩余${students.length}人），请减少抽取人数或重置名单`, 'error');
                    return;
                }
                startRolling();
                text.textContent = '停止抽取';
                icon.className = 'fas fa-stop';
                btn.classList.add('rolling');
            }
            isRunning = !isRunning;
        }

        function startRolling() {
            if (intervalId) clearInterval(intervalId);
            const resultText = document.getElementById('resultText');
            resultText.className = 'result-text rolling';
            intervalId = setInterval(() => {
                const selected = getRandomStudents(selectedNum);
                resultText.textContent = selected.join(', ');
                const sub = document.getElementById('resultSubtext');
                if (drawMode === 'noRepeat') {
                    sub.textContent = `剩余 ${students.length} 人未中奖`;
                } else {
                    sub.textContent = `名单中共 ${students.length} 人`;
                }
            }, 50);
        }

        function stopRolling() {
            if (intervalId) clearInterval(intervalId);
            intervalId = null;
            const resultText = document.getElementById('resultText');
            resultText.className = 'result-text';
            const winners = resultText.textContent.split(', ');
            drawStats.totalDraws++;
            winners.forEach(w => { if (w && !w.includes('请先')) drawStats.uniqueWinners.add(w); });
            updateStatsDisplay();
            saveToHistory(resultText.textContent);
            if (drawMode === 'noRepeat' && resultText.textContent && !resultText.textContent.includes('请先')) {
                removeWinnersFromList(winners);
            }
            document.getElementById('exportButton').disabled = false;
        }

        function removeWinnersFromList(winners) {
            winners.forEach(w => {
                const idx = students.indexOf(w);
                if (idx !== -1) students.splice(idx, 1);
            });
            drawStats.remainingCount = students.length;
            updateDataDisplay();
            updateStatsDisplay();
            if (students.length === 0) {
                showMessage('所有人员都已抽中！请重置名单继续抽取', 'warning');
                document.getElementById('drawButton').disabled = true;
            }
        }

        function getRandomStudents(count) {
            if (students.length === 0) return ["请先上传名单数据"];
            if (count >= students.length) return [...students];
            const selected = [];
            const temp = [...students];
            while (selected.length < count) {
                const idx = Math.floor(Math.random() * temp.length);
                selected.push(temp[idx]);
                if (drawMode === 'noRepeat') temp.splice(idx, 1);
            }
            return selected;
        }

        // ---------- 文件处理 ----------
        function handleTxtFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.name.toLowerCase().endsWith('.txt')) {
                showMessage('请上传TXT格式的文件', 'error');
                event.target.value = '';
                return;
            }
            showProcessingIndicator('正在读取TXT文件...');
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    parseTxtData(e.target.result);
                    showMessage(`TXT文件加载成功，共 ${students.length} 个名字`, 'success');
                } catch (err) {
                    showMessage('TXT文件读取失败', 'error');
                    console.error(err);
                } finally {
                    event.target.value = '';
                    hideProcessingIndicator();
                }
            };
            reader.onerror = function() {
                showMessage('文件读取失败，请重试', 'error');
                event.target.value = '';
                hideProcessingIndicator();
            };
            reader.readAsText(file, 'UTF-8');
        }

        function handleExcelFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const name = file.name.toLowerCase();
            const isExcel = name.endsWith('.xlsx') || name.endsWith('.xls');
            const isCsv = name.endsWith('.csv');
            if (!isExcel && !isCsv) {
                showMessage('请上传Excel或CSV格式的文件', 'error');
                event.target.value = '';
                return;
            }
            showProcessingIndicator(`正在解析${isExcel ? 'Excel' : 'CSV'}文件...`);
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    if (isExcel) {
                        parseExcelData(e.target.result);
                    } else {
                        parseCsvData(e.target.result);
                    }
                    showMessage(`文件加载成功，共 ${students.length} 个名字`, 'success');
                } catch (err) {
                    showMessage('文件解析失败，请检查文件格式', 'error');
                    console.error(err);
                } finally {
                    event.target.value = '';
                    hideProcessingIndicator();
                }
            };
            reader.onerror = function() {
                showMessage('文件读取失败，请重试', 'error');
                event.target.value = '';
                hideProcessingIndicator();
            };
            if (isExcel) {
                reader.readAsArrayBuffer(file);
            } else {
                reader.readAsText(file, 'UTF-8');
            }
        }

        function parseTxtData(content) {
            showLoading('正在解析名单数据...');
            const lines = content.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length === 0) {
                hideLoading();
                showMessage('TXT文件中没有找到有效数据', 'warning');
                return;
            }
            setTimeout(() => {
                students = [...new Set(lines)];
                originalStudents = [...students];
                drawStats.remainingCount = students.length;
                updateDataDisplay();
                document.getElementById('manualDataInput').value = lines.join('\n');
                updateLineCount();
                hideLoading();
            }, 600);
        }

        function parseCsvData(content) {
            showLoading('正在解析CSV数据...');
            const lines = content.split(/\r?\n/).map(line => {
                if (line.includes('"')) {
                    const m = line.match(/"[^"]+"/g);
                    if (m && m.length > 0) return m[0].replace(/"/g, '').trim();
                }
                const parts = line.split(',');
                return parts[0] ? parts[0].trim() : '';
            }).filter(n => n.length > 0 && !['name', '姓名'].includes(n.toLowerCase()));
            if (lines.length === 0) {
                hideLoading();
                showMessage('CSV文件中没有找到有效数据', 'warning');
                return;
            }
            setTimeout(() => {
                students = [...new Set(lines)];
                originalStudents = [...students];
                drawStats.remainingCount = students.length;
                updateDataDisplay();
                document.getElementById('manualDataInput').value = lines.join('\n');
                updateLineCount();
                hideLoading();
            }, 600);
        }

        function parseExcelData(data) {
            showLoading('正在解析Excel数据...');
            setTimeout(() => {
                try {
                    const workbook = XLSX.read(data, { type: 'array' });
                    const ws = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(ws, { header: 1 });
                    const names = [];
                    for (let i = 0; i < json.length; i++) {
                        if (json[i] && json[i][0]) {
                            const n = String(json[i][0]).trim();
                            if (n && n.length > 0) {
                                if (i === 0 && (n.toLowerCase().includes('name') || n.toLowerCase().includes('姓名') || n
                                        .toLowerCase().includes('名字'))) {
                                    continue;
                                }
                                names.push(n);
                            }
                        }
                    }
                    if (names.length === 0) {
                        hideLoading();
                        showMessage('Excel文件中没有找到有效数据', 'warning');
                        return;
                    }
                    students = [...new Set(names)];
                    originalStudents = [...students];
                    drawStats.remainingCount = students.length;
                    updateDataDisplay();
                    document.getElementById('manualDataInput').value = names.join('\n');
                    updateLineCount();
                    hideLoading();
                } catch (err) {
                    console.error('Excel解析错误:', err);
                    hideLoading();
                    showMessage('Excel文件解析失败', 'error');
                }
            }, 800);
        }

        // ---------- 数据操作 ----------
        function updateFromManualData() {
            const val = document.getElementById('manualDataInput').value.trim();
            if (!val) { showMessage('请输入抽奖名单数据', 'warning'); return; }
            showLoading('正在更新名单...');
            setTimeout(() => {
                parseTxtData(val);
                showMessage(`手动输入已更新，共 ${students.length} 个名字`, 'success');
            }, 500);
        }

        function loadExampleData() {
            showLoading('正在加载示例数据...');
            setTimeout(() => {
                const data =
                    `张三\n李四\n王五\n赵六\n钱七\n孙八\n周九\n吴十\n郑十一\n王十二\n刘十三\n陈十四\n杨十五\n黄十六\n赵十七\n周十八\n吴十九\n郑二十`;
                document.getElementById('manualDataInput').value = data;
                parseTxtData(data);
                showMessage('示例数据已加载，共 18 个名字', 'info');
            }, 800);
        }

        function clearManualData() {
            const el = document.getElementById('manualDataInput');
            if (!el.value.trim()) { showMessage('输入区域已经是空的', 'info'); return; }
            if (confirm('确定要清空手动输入的数据吗？')) {
                el.value = '';
                updateLineCount();
                showMessage('手动输入已清空', 'success');
            }
        }

        function clearAllData() {
            if (students.length === 0 && !document.getElementById('manualDataInput').value.trim() && drawHistory
                .length === 0) {
                showMessage('当前没有数据可清空', 'info');
                return;
            }
            if (confirm('确定要清空所有抽奖数据和历史记录吗？此操作不可撤销。')) {
                showLoading('正在清空数据...');
                setTimeout(() => {
                    students = [];
                    originalStudents = [];
                    drawHistory = [];
                    drawStats = { totalDraws: 0, uniqueWinners: new Set(), remainingCount: 0 };
                    document.getElementById('manualDataInput').value = '';
                    document.getElementById('resultText').textContent = '请先上传或输入抽奖名单';
                    document.getElementById('resultText').className = 'result-text result-placeholder';
                    document.getElementById('resultSubtext').textContent = '';
                    document.getElementById('drawButton').disabled = true;
                    document.getElementById('exportButton').disabled = true;
                    document.getElementById('resetButton').disabled = true;
                    updateDataDisplay();
                    updateHistoryDisplay();
                    updateLineCount();
                    updateStatsDisplay();
                    if (isRunning) {
                        stopRolling();
                        isRunning = false;
                        document.getElementById('drawText').textContent = '开始抽取';
                        document.getElementById('drawIcon').className = 'fas fa-dice';
                        document.getElementById('drawButton').classList.remove('rolling');
                    }
                    hideLoading();
                    showMessage('所有数据已清空', 'success');
                }, 600);
            }
        }

        function resetList() {
            if (originalStudents.length === 0) { showMessage('没有原始名单可重置', 'warning'); return; }
            showLoading('正在重置名单...');
            setTimeout(() => {
                students = [...originalStudents];
                drawStats.remainingCount = students.length;
                updateDataDisplay();
                updateStatsDisplay();
                document.getElementById('drawButton').disabled = false;
                hideLoading();
                showMessage('名单已重置，可以继续抽取', 'success');
            }, 500);
        }

        // ---------- 历史记录 ----------
        function saveToHistory(result) {
            if (!result || result.includes('请先')) return;
            const now = new Date();
            const time = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const date = now.toLocaleDateString('zh-CN');
            drawHistory.unshift({ result, time, date });
            if (drawHistory.length > 50) drawHistory = drawHistory.slice(0, 50);
            updateHistoryDisplay();
        }

        function updateHistoryDisplay() {
            const list = document.getElementById('historyList');
            if (drawHistory.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:var(--gray);padding:25px 0;font-size:0.9rem;">暂无抽奖记录</div>';
                return;
            }
            list.innerHTML = drawHistory.map((item, i) =>
                `<div class="history-item">
                        <div class="history-result">${i+1}. ${item.result}</div>
                        <div class="history-time">${item.time}</div>
                    </div>`
            ).join('');
        }

        function clearHistory() {
            if (drawHistory.length === 0) { showMessage('历史记录已经是空的', 'info'); return; }
            if (confirm('确定要清空所有抽奖历史记录吗？')) {
                drawHistory = [];
                updateHistoryDisplay();
                document.getElementById('exportButton').disabled = true;
                showMessage('历史记录已清空', 'success');
            }
        }

        // ---------- 显示更新 ----------
        function updateDataDisplay() {
            document.getElementById('currentCount').textContent = students.length;
            const status = document.getElementById('dataStatus');
            const btn = document.getElementById('drawButton');
            if (students.length === 0) {
                status.textContent = '等待数据';
                status.className = 'data-status status-warning';
                btn.disabled = true;
                document.getElementById('resultText').textContent = '请先上传或输入抽奖名单';
                document.getElementById('resultText').className = 'result-text result-placeholder';
                document.getElementById('resultSubtext').textContent = '';
            } else {
                status.textContent = `已加载 ${students.length} 个名字`;
                status.className = 'data-status status-success';
                btn.disabled = false;
                document.getElementById('resultText').textContent = `已加载 ${students.length} 个名字`;
                document.getElementById('resultText').className = 'result-text';
                const sub = document.getElementById('resultSubtext');
                sub.textContent = drawMode === 'noRepeat' ? `不重复模式，剩余 ${students.length} 人未中奖` :
                    `普通模式，点击开始按钮进行随机抽取`;
            }
            document.getElementById('resetButton').disabled = drawMode !== 'noRepeat';
        }

        function updateStatsDisplay() {
            document.getElementById('totalDraws').textContent = drawStats.totalDraws;
            document.getElementById('uniqueWinners').textContent = drawStats.uniqueWinners.size;
            document.getElementById('remainingCount').textContent = drawStats.remainingCount || students.length;
        }

        // ---------- 导出 & 模板 ----------
        function exportResults() {
            if (drawHistory.length === 0) { showMessage('没有抽奖记录可以导出', 'warning'); return; }
            showLoading('正在生成导出文件...');
            setTimeout(() => {
                let content = '抽奖结果记录\n';
                content += '生成时间: ' + new Date().toLocaleString('zh-CN') + '\n';
                content += '抽奖模式: ' + (drawMode === 'normal' ? '普通模式' : '不重复模式') + '\n';
                content += '名单总数: ' + originalStudents.length + ' 人\n';
                content += '剩余人数: ' + students.length + ' 人\n';
                content += '总抽取次数: ' + drawStats.totalDraws + '\n';
                content += '唯一获奖者: ' + drawStats.uniqueWinners.size + ' 人\n';
                content += '='.repeat(50) + '\n\n抽奖历史记录:\n\n';
                drawHistory.forEach((item, i) => {
                    content += `${i+1}. ${item.result} (${item.date} ${item.time})\n`;
                });
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `抽奖结果_${Date.now()}.txt`;
                link.click();
                hideLoading();
                showMessage('抽奖结果已导出', 'success');
            }, 600);
        }

        function downloadTemplate() {
            showLoading('正在生成模板...');
            setTimeout(() => {
                const csv = "姓名\n张三\n李四\n王五\n赵六\n钱七\n孙八\n周九\n吴十";
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = '抽奖名单模板.csv';
                link.click();
                hideLoading();
                showMessage('CSV模板下载成功', 'success');
            }, 500);
        }

        // ---------- Toast ----------
        function showMessage(text, type) {
            const container = document.getElementById('messageContainer');
            const el = document.createElement('div');
            el.className = `message ${type || 'info'}`;
            const icons = { success: 'fa-check-circle', warning: 'fa-exclamation-triangle', error: 'fa-times-circle',
                info: 'fa-info-circle' };
            el.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${text}</span>`;
            container.appendChild(el);
            setTimeout(() => el.classList.add('show'), 10);
            setTimeout(() => {
                el.classList.remove('show');
                setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
            }, 3000);
        }

        // ---------- 键盘快捷键 ----------
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space' && !e.target.matches('textarea, input')) {
                e.preventDefault();
                const btn = document.getElementById('drawButton');
                if (!btn.disabled) toggleRolling();
            }
        });
    </script>
</body>
</html>
